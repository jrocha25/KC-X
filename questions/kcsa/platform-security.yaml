# KCSA — Platform Security (16%) — 20 questions
# Topics: supply-chain 4 · image-repository 3 · observability 2 · service-mesh 3 · pki 3
#         connectivity 2 · admission-control 3
# Original questions. Not taken from any real exam. See docs/QUESTION_FORMAT.md.

# ---------------------------------------------------------------- supply-chain (4)

- id: kcsa-ps-001
  domain: platform-security
  topic: supply-chain
  difficulty: easy
  question: What is a software bill of materials (SBOM)?
  options:
    A: "A signed record of who approved a deployment"
    B: "A report listing exploitable CVEs in an image"
    C: "An inventory of the components in a piece of software"
    D: "A policy that blocks unsigned images at admission time in the cluster"
  answer: C
  explanation: >
    An SBOM lists the packages, libraries and versions that make up a piece of software.
    It lets you quickly find which artifacts are affected when a new vulnerability is
    published. It is an inventory, not a scan result or a policy.
  references:
    - https://www.cisa.gov/sbom
    - https://spdx.dev/

- id: kcsa-ps-002
  domain: platform-security
  topic: supply-chain
  difficulty: medium
  question: In the Sigstore project, what does Rekor provide?
  options:
    A: "A public, append-only transparency log of signatures"
    B: "A certificate authority issuing short-lived signing certs"
    C: "A private registry for storing signed container images"
    D: "An admission controller that verifies image signatures"
  answer: A
  explanation: >
    Rekor records signing events in a tamper-evident transparency log that anyone can
    audit. Fulcio is the certificate authority that issues short-lived certificates for
    keyless signing, and cosign is the tool that signs and verifies.
  references:
    - https://docs.sigstore.dev/logging/overview/
    - https://docs.sigstore.dev/about/overview/

- id: kcsa-ps-003
  domain: platform-security
  topic: supply-chain
  difficulty: easy
  question: What does the SLSA framework mainly describe?
  options:
    A: "A file format for listing software components"
    B: "A standard for scanning images for CVEs"
    C: "A Kubernetes API for signing container images"
    D: "Levels of assurance that builds weren't tampered with"
  answer: D
  explanation: >
    SLSA (Supply-chain Levels for Software Artifacts) defines increasing levels of build
    integrity, such as provenance generated by a hardened build platform, so consumers
    can trust how an artifact was produced.
  references:
    - https://slsa.dev/spec/v1.0/levels

- id: kcsa-ps-004
  domain: platform-security
  topic: supply-chain
  difficulty: hard
  question: >
    A cluster must only run images built by the company's own CI pipeline. Which
    combination enforces this?
  options:
    A: "Scan images nightly and alert on critical CVEs"
    B: "Sign images in CI and verify them at admission"
    C: "Use the latest tag with imagePullPolicy: Always"
    D: "Host images in a registry with public read access"
  answer: B
  explanation: >
    Signing in CI (for example with cosign) creates verifiable proof of origin. An
    admission policy, such as a Kyverno verifyImages rule or a Sigstore policy controller,
    rejects Pods whose images lack a valid signature from that pipeline. Scanning finds
    vulnerabilities but does not prove where an image came from.
  references:
    - https://docs.sigstore.dev/cosign/signing/overview/
    - https://kyverno.io/docs/policy-types/cluster-policy/verify-images/

# ---------------------------------------------------------------- image-repository (3)

- id: kcsa-ps-005
  domain: platform-security
  topic: image-repository
  difficulty: easy
  question: How does a Pod get credentials to pull from a private container registry?
  options:
    A: "Through imagePullSecrets referencing a registry Secret"
    B: "Through an annotation holding the registry password"
    C: "Through the credentials of the node's kube-proxy"
    D: "Through a ConfigMap named registry-auth in the namespace"
  answer: A
  explanation: >
    imagePullSecrets on the Pod (or its ServiceAccount) references a Secret of type
    kubernetes.io/dockerconfigjson, which the kubelet uses when pulling the image. Nodes
    can also be configured with registry credentials or a credential provider plugin.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    - https://kubernetes.io/docs/concepts/containers/images/

- id: kcsa-ps-006
  domain: platform-security
  topic: image-repository
  difficulty: hard
  question: >
    In a multi-tenant cluster, why might admins enable the AlwaysPullImages admission
    plugin?
  options:
    A: "So nodes never run out of disk space for old cached image layers"
    B: "So every image is scanned for CVEs before it starts"
    C: "So Pods can't use cached private images without credentials"
    D: "So image tags are rewritten to digests automatically"
  answer: C
  explanation: >
    Once a private image is cached on a node, another tenant's Pod could otherwise start
    it without having registry credentials. Forcing imagePullPolicy: Always makes the
    kubelet authenticate to the registry for each Pod. It does not scan or pin images.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- id: kcsa-ps-007
  domain: platform-security
  topic: image-repository
  difficulty: easy
  question: >
    Which registry capability helps stop known-vulnerable images from being pulled into
    production?
  options:
    A: "Anonymous pull access for every repository"
    B: "Scanning with a policy blocking critical findings"
    C: "Mutable tags so fixed images overwrite old ones"
    D: "Geo-replication of each repository to all regions"
  answer: B
  explanation: >
    Registries such as Harbor can scan pushed images and prevent pulls of images with
    vulnerabilities above a chosen severity. Anonymous access and mutable tags weaken
    control over what gets pulled.
  references:
    - https://goharbor.io/docs/main/working-with-projects/project-configuration/

# ---------------------------------------------------------------- observability (2)

- id: kcsa-ps-008
  domain: platform-security
  topic: observability
  difficulty: easy
  question: Which data source answers "who deleted this Deployment, and when?"
  options:
    A: "The container's stdout logs"
    B: "Prometheus node metrics"
    C: "The Deployment's status field"
    D: "Kubernetes audit logs"
  answer: D
  explanation: >
    Audit logs record each request to the API server with the user, verb, resource and
    timestamp. Container logs and metrics describe workloads, and a deleted object's
    status is gone with it.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/

- id: kcsa-ps-009
  domain: platform-security
  topic: observability
  difficulty: medium
  question: Why should audit and security logs be shipped to a system outside the cluster?
  options:
    A: "Kubernetes deletes all of a node's logs whenever a Pod restarts"
    B: "The API server cannot write any logs to local disk"
    C: "Shipping logs is required before auditing can start"
    D: "An attacker who controls the cluster could alter them"
  answer: D
  explanation: >
    Logs stored only on cluster nodes can be modified or deleted by an attacker who gains
    control of those nodes. Forwarding them to separate, access-controlled storage keeps
    them trustworthy for detection and investigation.
  references:
    - https://kubernetes.io/docs/concepts/security/cloud-native-security/
    - https://kubernetes.io/docs/concepts/cluster-administration/logging/

# ---------------------------------------------------------------- service-mesh (3)

- id: kcsa-ps-010
  domain: platform-security
  topic: service-mesh
  difficulty: easy
  question: >
    Which security feature do service meshes such as Istio and Linkerd commonly add
    without application code changes?
  options:
    A: "Encryption of all Secrets at rest in etcd"
    B: "Signing of container images during CI"
    C: "Automatic mutual TLS between workloads"
    D: "CIS Benchmark scanning of every node"
  answer: C
  explanation: >
    The mesh's proxies (sidecars or node-level proxies) handle TLS for the application,
    issuing and rotating workload certificates automatically, so service-to-service
    traffic is encrypted and authenticated.
  references:
    - https://linkerd.io/2/features/automatic-mtls/
    - https://istio.io/latest/docs/concepts/security/

- id: kcsa-ps-011
  domain: platform-security
  topic: service-mesh
  difficulty: easy
  question: What is a SPIFFE ID?
  options:
    A: "A URI naming a workload, like spiffe://domain/path"
    B: "The audience claim in a ServiceAccount token"
    C: "A hash of a container image's manifest digest"
    D: "The serial number of a kubelet serving cert"
  answer: A
  explanation: >
    SPIFFE defines a standard workload identity: a URI made of a trust domain and a path.
    It is carried in an X.509 or JWT SVID. Meshes such as Istio use SPIFFE IDs to
    identify workloads in mTLS.
  references:
    - https://spiffe.io/docs/latest/spiffe-about/overview/

- id: kcsa-ps-012
  domain: platform-security
  topic: service-mesh
  difficulty: medium
  question: Beyond encryption, what does mTLS-based workload identity in a mesh enable?
  options:
    A: "Autoscaling based on request latency"
    B: "Authorization based on the caller's identity"
    C: "Encryption of persistent volumes"
    D: "Replacing RBAC for kubectl users"
  answer: B
  explanation: >
    Because each connection is authenticated, the mesh knows which workload is calling
    and can enforce policies such as "only the frontend may call the payments service".
    It does not affect API server RBAC or storage encryption.
  references:
    - https://istio.io/latest/docs/concepts/security/

# ---------------------------------------------------------------- pki (3)

- id: kcsa-ps-013
  domain: platform-security
  topic: pki
  difficulty: easy
  question: >
    Which Kubernetes API lets a client request a certificate signed by a cluster signer,
    for example for kubelet client certificates?
  options:
    A: TokenRequest
    B: CertificateSigningRequest
    C: SubjectAccessReview
    D: TokenReview
  answer: B
  explanation: >
    A CertificateSigningRequest (CSR) object asks a signer to issue an X.509 certificate.
    Kubelet TLS bootstrapping uses it. TokenRequest issues ServiceAccount tokens, and the
    review APIs check tokens and permissions.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/

- id: kcsa-ps-014
  domain: platform-security
  topic: pki
  difficulty: medium
  question: >
    Control plane certificates generated by kubeadm are valid for one year by default.
    How can an admin see when they expire?
  options:
    A: "kubectl get certificates -A"
    B: "kubectl describe node --show-certs"
    C: "kubeadm token list --expiry"
    D: "kubeadm certs check-expiration"
  answer: D
  explanation: >
    kubeadm certs check-expiration lists each certificate kubeadm manages with its
    expiry date. Upgrading with kubeadm renews them, and kubeadm certs renew renews them
    manually. Expired certificates break control plane communication.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/

- id: kcsa-ps-015
  domain: platform-security
  topic: pki
  difficulty: medium
  question: Why must the cluster CA private key be tightly protected?
  options:
    A: "Its holder can mint certs for any user, even system:masters"
    B: "It decrypts every Secret that is stored in etcd"
    C: "It signs every container image the cluster runs"
    D: "It is needed to rotate ServiceAccount tokens"
  answer: A
  explanation: >
    The API server trusts client certificates signed by the cluster CA. With the CA key,
    an attacker can issue a certificate with any username and group, including
    system:masters, and that certificate cannot be revoked short of replacing the CA.
  references:
    - https://kubernetes.io/docs/setup/best-practices/certificates/
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/

# ---------------------------------------------------------------- connectivity (2)

- id: kcsa-ps-016
  domain: platform-security
  topic: connectivity
  difficulty: medium
  question: >
    Which kube-apiserver flag provides the CA bundle used to verify each kubelet's
    serving certificate?
  options:
    A: "--kubelet-client-certificate"
    B: "--client-ca-file"
    C: "--kubelet-certificate-authority"
    D: "--tls-cert-file"
  answer: C
  explanation: >
    --kubelet-certificate-authority gives the API server the CA bundle to check kubelet
    serving certificates. --kubelet-client-certificate is the API server's own client
    cert towards the kubelet, and the other two configure the API server's own TLS.
  references:
    - https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/

- id: kcsa-ps-017
  domain: platform-security
  topic: connectivity
  difficulty: medium
  question: What does the Konnectivity service provide?
  options:
    A: "A mesh that adds mTLS between all Pods"
    B: "A VPN that kubectl users connect through first"
    C: "A DNS server for the cluster's Services"
    D: "A tunnel for control-plane-to-node traffic"
  answer: D
  explanation: >
    Konnectivity agents on the nodes open connections to a Konnectivity server on the
    control plane, and the API server sends its traffic to nodes (exec, logs, webhooks)
    through that tunnel. Nodes don't need to accept inbound connections from the control
    plane network.
  references:
    - https://kubernetes.io/docs/tasks/extend-kubernetes/setup-konnectivity/
    - https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/

# ---------------------------------------------------------------- admission-control (3)

- id: kcsa-ps-018
  domain: platform-security
  topic: admission-control
  difficulty: easy
  question: In which order do the admission control phases run?
  options:
    A: "Mutating admission, then validating admission"
    B: "Validating admission, then mutating admission"
    C: "Both phases run in parallel for speed"
    D: "Only validating admission, and only for Pods"
  answer: A
  explanation: >
    Mutating admission runs first so that defaults and injected settings are in place.
    Validating admission then checks the final object, so a later mutation cannot sneak
    past validation.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- id: kcsa-ps-019
  domain: platform-security
  topic: admission-control
  difficulty: medium
  question: >
    Which built-in feature lets you write admission validation rules in CEL without
    running a webhook server?
  options:
    A: PodSecurityPolicy
    B: ValidatingWebhookConfiguration
    C: ValidatingAdmissionPolicy
    D: NetworkPolicy
  answer: C
  explanation: >
    ValidatingAdmissionPolicy evaluates CEL expressions inside the API server, so there
    is no external service to run or secure. A ValidatingWebhookConfiguration calls an
    external webhook, and PodSecurityPolicy has been removed from Kubernetes.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/

- id: kcsa-ps-020
  domain: platform-security
  topic: admission-control
  difficulty: hard
  question: >
    A validating webhook that enforces security rules is set to failurePolicy: Ignore.
    What is the risk?
  options:
    A: "If the webhook is down, every matching API request is rejected"
    B: "If the webhook is down, requests are admitted unchecked"
    C: "Requests are evaluated twice when the webhook is slow"
    D: "Its decisions are no longer written to the audit log"
  answer: B
  explanation: >
    With Ignore, errors and timeouts calling the webhook are treated as success, so an
    attacker who can disrupt the webhook can bypass its checks. Fail closes that gap but
    makes the webhook's availability critical.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
