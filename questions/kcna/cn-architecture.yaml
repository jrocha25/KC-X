# KCNA — Cloud Native Architecture (12%) — 35 questions
# Topics: observability 15 · ecosystem-principles 14 · community-collaboration 6
# Original questions. Not taken from any real exam. See docs/QUESTION_FORMAT.md.

# ---------------------------------------------------------------- observability (15)

- id: kcna-ca-001
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: Which three telemetry signals are commonly called the pillars of observability?
  options:
    A: CPU, memory and disk
    B: Alerts, dashboards and runbooks
    C: Metrics, logs and traces
    D: Pods, Services and Ingresses
  answer: C
  explanation: >
    Metrics are numeric measurements over time, logs are timestamped event records, and
    traces follow a single request across services. Together they help explain what a
    system is doing and why.
  references:
    - https://glossary.cncf.io/observability/
    - https://opentelemetry.io/docs/concepts/signals/

- id: kcna-ca-002
  domain: cn-architecture
  topic: observability
  difficulty: hard
  question: >
    Prometheus normally collects metrics by scraping HTTP endpoints. A short-lived batch
    job finishes before Prometheus can scrape it. What is the documented way to capture
    its metrics?
  options:
    A: "Push its metrics to a Pushgateway that Prometheus scrapes"
    B: "Configure Prometheus to parse the job's log files after it exits"
    C: "Lower the scrape interval to one second so the job is always caught"
    D: "Write the metrics to a ConfigMap that Prometheus reads on startup"
  answer: A
  explanation: >
    Prometheus uses a pull model. For service-level batch jobs that may not live long
    enough to be scraped, the Pushgateway acts as an intermediary - the job pushes, and
    Prometheus scrapes the gateway. It is not meant to turn Prometheus into a push system
    in general.
  references:
    - https://prometheus.io/docs/practices/pushing/
    - https://prometheus.io/docs/introduction/overview/

- id: kcna-ca-003
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: What is OpenTelemetry?
  options:
    A: "A Kubernetes-native database for long-term storage of logs, metrics and traces"
    B: "A vendor-neutral set of APIs, SDKs and a Collector for telemetry data"
    C: "A dashboarding and alerting tool designed to replace Grafana"
    D: "A commercial APM product sold and supported by the CNCF itself"
  answer: B
  explanation: >
    OpenTelemetry (OTel) is a CNCF project that standardizes how telemetry is produced and
    shipped. It is not a backend - data is exported to tools such as Prometheus, Jaeger or
    commercial vendors.
  references:
    - https://opentelemetry.io/docs/what-is-opentelemetry/

- id: kcna-ca-004
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: >
    A checkout request passes through six microservices and is sometimes slow. Which
    technique shows how long each service spent on that specific request?
  options:
    A: "Centralized logging with all service logs in one place"
    B: "Node-level CPU and memory metrics for each worker"
    C: "Liveness probes with shorter timeouts on every service"
    D: "Distributed tracing, with one span per service"
  answer: D
  explanation: >
    A trace represents one request's path through the system; each span records an
    operation's timing and metadata. Tools such as Jaeger visualize traces to pinpoint
    latency.
  references:
    - https://opentelemetry.io/docs/concepts/signals/traces/
    - https://www.jaegertracing.io/docs/

- id: kcna-ca-005
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: >
    Which Prometheus metric type represents a value that only goes up (or resets to zero on
    restart), such as the total number of HTTP requests served?
  options:
    A: Counter
    B: Gauge
    C: Histogram
    D: Summary
  answer: A
  explanation: >
    A counter is cumulative and monotonically increasing; you usually query it with rate()
    to get a per-second rate. A gauge can go up and down (e.g. memory in use); histograms
    and summaries sample observations such as request durations.
  references:
    - https://prometheus.io/docs/concepts/metric_types/

- id: kcna-ca-006
  domain: cn-architecture
  topic: observability
  difficulty: hard
  question: >
    A service has an availability SLO of 99.9% measured over 30 days. Roughly how much
    downtime does its error budget allow in that window?
  options:
    A: "About 4.3 minutes"
    B: About 7 hours
    C: About 43 minutes
    D: About 3 days
  answer: C
  explanation: >
    30 days is 43,200 minutes; 0.1% of that is about 43 minutes. The SLI is the measured
    indicator (e.g. successful request ratio), the SLO is the target, and the error budget
    is the allowed shortfall (100% - SLO).
  references:
    - https://sre.google/sre-book/service-level-objectives/

- id: kcna-ca-015
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: >
    What is the name of the functional query language used to select and aggregate time
    series data in Prometheus?
  options:
    A: "SQL"
    B: "PromQL"
    C: "LogQL"
    D: "GraphQL"
  answer: B
  explanation: >
    Prometheus provides PromQL (Prometheus Query Language) for selecting and aggregating
    time series in real time. The result can be shown as a graph or table, or read by other
    programs through the HTTP API. LogQL is Loki's query language, and GraphQL is a general
    API query language.
  references:
    - https://prometheus.io/docs/prometheus/latest/querying/basics/

- id: kcna-ca-016
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: >
    You want to find the 95th percentile of request latency, aggregated across many
    instances of a service. Which Prometheus metric type fits best?
  options:
    A: "Gauge"
    B: "Counter"
    C: "Histogram"
    D: "Info"
  answer: C
  explanation: >
    A histogram counts observations, such as request durations, in configurable buckets.
    histogram_quantile() can compute quantiles from it, even after aggregating histograms
    from many instances. A gauge is a single value that can go up and down, and a counter
    only goes up.
  references:
    - https://prometheus.io/docs/concepts/metric_types/

- id: kcna-ca-017
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: >
    Kubernetes doesn't provide a native solution for cluster-level logging. What is a
    common way to ship every container's logs to a central backend?
  options:
    A: "Configure kube-apiserver to forward all the logs that it receives"
    B: "Store the logs of each Pod in etcd next to its spec"
    C: "Make each Pod mount a ConfigMap that collects its output"
    D: "Run a node-level logging agent on every node as a DaemonSet"
  answer: D
  explanation: >
    The usual approach is a node-level logging agent, such as Fluent Bit, deployed as a
    DaemonSet. It reads the container log files on each node and forwards them to a
    backend. The API server does not receive container logs, and etcd and ConfigMaps are
    not log stores.
  references:
    - https://kubernetes.io/docs/concepts/cluster-administration/logging/

- id: kcna-ca-022
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: What is the main role of the OpenTelemetry Collector?
  options:
    A: "A time-series database that stores metrics for long periods"
    B: "A dashboard tool for building graphs and alert panels"
    C: "A vendor-agnostic agent that receives, processes and exports telemetry"
    D: "A language SDK that adds tracing code to applications for you"
  answer: C
  explanation: >
    The Collector is a vendor-agnostic proxy that receives telemetry (traces, metrics,
    logs) in many formats, processes it (batching, filtering, enriching) and exports it to
    one or more backends. You can switch backends without changing application code.
    Storage and dashboards are backend jobs, and SDKs live inside the application.
  references:
    - https://opentelemetry.io/docs/collector/

- id: kcna-ca-023
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: >
    In the Prometheus ecosystem, which component deduplicates, groups and routes the alerts
    that Prometheus fires to receivers such as email or chat?
  options:
    A: Pushgateway
    B: Grafana
    C: node_exporter
    D: Alertmanager
  answer: D
  explanation: >
    Prometheus evaluates alerting rules and sends the firing alerts to Alertmanager, which
    deduplicates, groups and routes them to receivers and handles silencing and
    inhibition. Pushgateway accepts metrics from short-lived jobs, Grafana draws
    dashboards, and node_exporter exposes host metrics.
  references:
    - https://prometheus.io/docs/alerting/latest/alertmanager/

- id: kcna-ca-024
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: >
    You want Prometheus metrics about object state, such as how many replicas of each
    Deployment are available or which Pods are not ready. Which add-on exposes these?
  options:
    A: kube-state-metrics
    B: metrics-server
    C: cAdvisor
    D: node_exporter
  answer: A
  explanation: >
    kube-state-metrics watches the API server and exposes metrics generated from the state
    of objects - phases, conditions, replica counts, labels. metrics-server gives current
    CPU and memory usage for kubectl top and autoscaling, while cAdvisor and node_exporter
    report container and host resource usage.
  references:
    - https://kubernetes.io/docs/concepts/cluster-administration/kube-state-metrics/

- id: kcna-ca-030
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: >
    Which Prometheus metric type fits a value that can go up and down, such as current
    memory use or the length of a queue?
  options:
    A: Counter
    B: Gauge
    C: Histogram
    D: Summary
  answer: B
  explanation: >
    A gauge is a single number that can rise and fall. A counter only increases (or resets
    on restart), and histograms and summaries sample observations such as request durations
    into buckets or quantiles.
  references:
    - https://prometheus.io/docs/concepts/metric_types/

- id: kcna-ca-031
  domain: cn-architecture
  topic: observability
  difficulty: medium
  question: Which statement correctly distinguishes an SLI, an SLO and an SLA?
  options:
    A: "SLI: a target; SLO: a measurement; SLA: an internal goal"
    B: "SLI: a measurement; SLO: a target for it; SLA: a contract"
    C: "SLI: a contract; SLO: a measurement; SLA: a target for it"
    D: "SLI: a measurement; SLO: a contract; SLA: a target for it"
  answer: B
  explanation: >
    A service level indicator is a measured value, such as the share of successful
    requests. An objective is the target for that indicator, for example 99.9%. An
    agreement is a contract with users that states the consequences of missing the
    objectives.
  references:
    - https://sre.google/sre-book/service-level-objectives/

- id: kcna-ca-032
  domain: cn-architecture
  topic: observability
  difficulty: easy
  question: In distributed tracing, what is a span?
  options:
    A: "A single operation in a trace, with a start and end time"
    B: "The complete set of log lines a service writes for a request"
    C: "The time window that a Prometheus query aggregates over"
    D: "A sampled subset of the metrics that a service exports"
  answer: A
  explanation: >
    A trace is made of spans. Each span is one unit of work, such as an HTTP call or a
    database query, with timing, attributes and a link to its parent span. Logs and
    metrics are separate signals.
  references:
    - https://opentelemetry.io/docs/concepts/signals/traces/

# --------------------------------------------------------- ecosystem-principles (14)

- id: kcna-ca-007
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: easy
  question: According to the CNCF cloud native definition, which approaches exemplify cloud native?
  options:
    A: "Containers, service meshes, microservices and declarative APIs"
    B: "Virtual machines managed by hand with long-lived configuration changes"
    C: "Shared databases with tightly coupled services released together"
    D: "A single large application deployed as one unit on dedicated servers"
  answer: A
  explanation: >
    The CNCF definition says cloud native technologies let organizations build and run
    scalable applications in modern, dynamic environments, exemplified by containers,
    service meshes, microservices, immutable infrastructure and declarative APIs.
  references:
    - https://github.com/cncf/toc/blob/main/DEFINITION.md

- id: kcna-ca-008
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: easy
  question: What is a key advantage of a microservices architecture over a monolith?
  options:
    A: "It always uses less memory and CPU than a monolith"
    B: "It reduces the amount of network communication between components"
    C: "It makes data consistency across the system simpler to maintain"
    D: Services can be developed, deployed and scaled independently
  answer: D
  explanation: >
    Microservices split an application into small, loosely coupled services with their own
    lifecycle, so teams can release and scale them independently. The trade-off is more
    network communication and operational complexity.
  references:
    - https://glossary.cncf.io/microservices-architecture/

- id: kcna-ca-009
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: >
    A team wants to run event-driven functions that scale to zero when idle and not manage
    any servers. Which model fits, and which CNCF project supports it on Kubernetes?
  options:
    A: Infrastructure as a Service, with etcd
    B: Serverless, with Knative
    C: Batch computing, with CronJobs
    D: Virtualization, with KubeVirt
  answer: B
  explanation: >
    Serverless lets developers deploy code while the platform handles provisioning and
    scaling, including scale-to-zero. Knative provides serverless serving and eventing on
    top of Kubernetes.
  references:
    - https://glossary.cncf.io/serverless/
    - https://knative.dev/docs/

- id: kcna-ca-010
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: What does the principle of immutable infrastructure mean?
  options:
    A: "Instances are never changed after deployment; they are replaced with new ones"
    B: "Infrastructure, once created, can never be deleted or scaled down"
    C: "All configuration is hard-coded into the application binary at build time"
    D: "Servers are patched in place so instances never need to be replaced"
  answer: A
  explanation: >
    With immutable infrastructure, a change means building a new image and replacing the
    running instances. This avoids configuration drift and makes rollbacks predictable.
  references:
    - https://glossary.cncf.io/immutable-infrastructure/

- id: kcna-ca-011
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: >
    A team wants mutual TLS between all services, retries and traffic splitting, and
    per-request telemetry, without changing application code. What kind of tool provides
    this?
  options:
    A: A container registry such as Harbor
    B: "A CI/CD system such as Jenkins or Tekton"
    C: A service mesh such as Istio or Linkerd
    D: A package manager such as Helm
  answer: C
  explanation: >
    A service mesh adds a dedicated infrastructure layer (sidecar or node-level proxies)
    that handles service-to-service security, reliability and observability transparently
    to the application.
  references:
    - https://glossary.cncf.io/service-mesh/

- id: kcna-ca-018
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: easy
  question: >
    An application handles more load by running additional replicas on more machines.
    What is this called?
  options:
    A: "Horizontal scaling"
    B: "Vertical scaling"
    C: "Bin packing"
    D: "Overcommitting"
  answer: A
  explanation: >
    Horizontal scaling (scaling out) adds more instances or nodes so work can run
    concurrently. Vertical scaling gives a single instance more CPU or memory instead.
    Bin packing is about placing workloads efficiently, and overcommitting means promising
    more resources than a node has.
  references:
    - https://glossary.cncf.io/horizontal-scaling/

- id: kcna-ca-019
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: What is a Kubernetes operator?
  options:
    A: "A cluster administrator role with full RBAC access"
    B: "A controller that manages an application through custom resources"
    C: "A kubectl plugin that runs the same command against many clusters"
    D: "A managed Kubernetes service run by a cloud provider"
  answer: B
  explanation: >
    The operator pattern encodes a human operator's knowledge of running an application
    in software. An operator is a client of the Kubernetes API that acts as a controller for
    one or more custom resources, reconciling them in a control loop. It is not a person,
    a role or a hosting service.
  references:
    - https://kubernetes.io/docs/concepts/extend-kubernetes/operator/

- id: kcna-ca-020
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: hard
  question: >
    During a traffic spike the HorizontalPodAutoscaler raises a Deployment's replicas, but
    the new Pods stay Pending with "Insufficient cpu" on every node. Which component
    addresses this?
  options:
    A: "A second HorizontalPodAutoscaler with a lower CPU target"
    B: "The Vertical Pod Autoscaler, to raise each Pod's CPU request"
    C: "A node autoscaler such as Cluster Autoscaler or Karpenter"
    D: "The kube-scheduler, once its scoring weights have been tuned"
  answer: C
  explanation: >
    The HPA adds Pods but not capacity. Node autoscalers such as Cluster Autoscaler and
    Karpenter provision new nodes for unschedulable Pods (and consolidate nodes when
    demand falls). Raising requests with the VPA would make the Pods even harder to place,
    and scheduler tuning cannot create CPU that does not exist.
  references:
    - https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/

- id: kcna-ca-025
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: easy
  question: >
    Which CNCF graduated project detects threats at runtime by watching Linux system calls
    against rules, such as a shell being started inside a container?
  options:
    A: Kubescape
    B: Open Policy Agent
    C: Falco
    D: Jaeger
  answer: C
  explanation: >
    Falco parses Linux syscalls at runtime and checks them against YAML rules, raising
    alerts for behaviour such as a shell starting in a container or an unexpected write to
    a sensitive file. Kubescape checks configuration posture rather than live behaviour,
    OPA evaluates policies (for example at admission), and Jaeger does tracing.
  references:
    - https://falco.org/docs/

- id: kcna-ca-026
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: >
    A team wants to find risky configuration before and after deployment, and also catch
    suspicious behaviour in running containers. Which pairing covers both?
  options:
    A: "Falco for configuration scanning and Kubescape for runtime alerts"
    B: "Kubescape for posture scanning and Falco for runtime detection"
    C: "Prometheus for configuration scanning and Jaeger for runtime alerts"
    D: "Helm for configuration scanning and Linkerd for runtime detection"
  answer: B
  explanation: >
    Kubescape scans clusters and manifests against frameworks such as NSA-CISA and CIS to
    find misconfiguration (posture). Falco watches live syscall activity and alerts on
    suspicious behaviour (runtime). The first option swaps their roles, and the others
    pair observability, packaging or mesh tools with security jobs they don't do.
  references:
    - https://github.com/kubescape/kubescape
    - https://falco.org/docs/

- id: kcna-ca-029
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: >
    A web service keeps each user's session in the memory of the replica that served them.
    Whenever Pods are scaled out or replaced, users are logged out. Which cloud native
    principle does this design break?
  options:
    A: "Services should always be scaled vertically instead of horizontally"
    B: "Each service should be built as one large container image"
    C: "Configuration should be compiled into the application binary"
    D: "Processes should be stateless and keep state in a backing service"
  answer: D
  explanation: >
    Cloud native services are designed to be stateless and disposable - any replica can
    serve any request, so Pods can be added, removed or rescheduled freely. Session data
    belongs in a backing service such as a database or cache. Vertical scaling, large
    images and compiled-in configuration go against cloud native practice and would not
    fix the problem.
  references:
    - https://glossary.cncf.io/stateless-apps/
    - https://12factor.net/processes

- id: kcna-ca-033
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: >
    A team wants Deployments to scale on the length of a message queue, including down to
    zero replicas when the queue is empty. Which CNCF project is built for this?
  options:
    A: Argo Rollouts
    B: KEDA
    C: Cluster Autoscaler
    D: Vertical Pod Autoscaler
  answer: B
  explanation: >
    KEDA (Kubernetes Event-driven Autoscaling) scales workloads on external event sources
    such as queues and streams, and it can scale them to zero. It works together with the
    HorizontalPodAutoscaler. Argo Rollouts handles progressive delivery, the Cluster
    Autoscaler scales nodes, and the VPA resizes Pods.
  references:
    - https://keda.sh/
    - https://kubernetes.io/docs/concepts/workloads/autoscaling/

- id: kcna-ca-034
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: easy
  question: >
    Which cloud native property describes a system that detects failures and recovers
    without human help, for example by restarting failed containers?
  options:
    A: Self-healing
    B: Immutability
    C: Portability
    D: Observability
  answer: A
  explanation: >
    A self-healing system uses a control loop that compares the actual state with the
    desired state and corrects differences, such as replacing failed Pods. Immutability is
    about replacing instead of changing components, portability about running anywhere,
    and observability about understanding a system from its outputs.
  references:
    - https://glossary.cncf.io/self-healing/

- id: kcna-ca-035
  domain: cn-architecture
  topic: ecosystem-principles
  difficulty: medium
  question: Why do the CRI, CNI and CSI interfaces matter to Kubernetes users?
  options:
    A: "They are paid add-ons sold by cloud providers for Kubernetes"
    B: "They replace the kube-apiserver for runtime, network and storage"
    C: "They define one encrypted protocol that all Pods must use"
    D: "They let vendors plug in without changing Kubernetes itself"
  answer: D
  explanation: >
    These open interfaces let container runtimes, network plugins and storage drivers be
    developed and swapped independently of Kubernetes' own code. This avoids lock-in and
    keeps the core small. They are open specifications, not paid products, and they don't
    replace the API server.
  references:
    - https://kubernetes.io/docs/concepts/extend-kubernetes/
    - https://kubernetes.io/docs/concepts/architecture/cri/

# ---------------------------------------------------- community-collaboration (6)

- id: kcna-ca-012
  domain: cn-architecture
  topic: community-collaboration
  difficulty: easy
  question: What are the three maturity levels for projects hosted by the CNCF?
  options:
    A: Alpha, Beta, Stable
    B: Bronze, Silver, Gold
    C: Experimental, Supported, Deprecated
    D: Sandbox, Incubating, Graduated
  answer: D
  explanation: >
    CNCF projects enter as Sandbox, move to Incubating, and then to Graduated as they show
    adoption, healthy governance and security practices. Kubernetes, Prometheus and Envoy
    are graduated projects. Alpha/Beta/Stable are Kubernetes feature stages.
  references:
    - https://www.cncf.io/projects/

- id: kcna-ca-013
  domain: cn-architecture
  topic: community-collaboration
  difficulty: easy
  question: In the Kubernetes community, what is a SIG?
  options:
    A: "A Special Interest Group that owns an area such as networking"
    B: A Security Incident Guide published after each release
    C: "A Software Integration Gateway that connects clusters together"
    D: "A Steering Interest Group elected to approve every pull request"
  answer: A
  explanation: >
    Kubernetes is organized into Special Interest Groups (SIG Network, SIG Storage, SIG
    Node, ...) that hold open meetings and own parts of the codebase. Anyone can join.
  references:
    - https://github.com/kubernetes/community/blob/master/sig-list.md

- id: kcna-ca-014
  domain: cn-architecture
  topic: community-collaboration
  difficulty: medium
  question: How are significant new features or changes to Kubernetes formally proposed and tracked?
  options:
    A: "Through feature requests filed with cloud vendors"
    B: Through Kubernetes Enhancement Proposals (KEPs)
    C: "Through GitHub issues voted on by the community"
    D: "Through decisions in private CNCF Governing Board meetings"
  answer: B
  explanation: >
    A KEP describes the motivation, design, graduation criteria and production readiness
    of an enhancement. KEPs are reviewed in the open by the owning SIGs and tracked per
    release in the kubernetes/enhancements repository.
  references:
    - https://github.com/kubernetes/enhancements

- id: kcna-ca-021
  domain: cn-architecture
  topic: community-collaboration
  difficulty: medium
  question: >
    Which CNCF body is the technical governing body that admits projects into the CNCF
    and oversees them?
  options:
    A: "The Kubernetes Steering Committee"
    B: "The CNCF End User Technical Advisory Board"
    C: "The Linux Foundation Board of Directors"
    D: "The Technical Oversight Committee (TOC)"
  answer: D
  explanation: >
    The CNCF TOC is the foundation's technical governing body. It admits and oversees all
    CNCF projects and maintains the foundation's technical vision. The Kubernetes Steering
    Committee governs only the Kubernetes project.
  references:
    - https://github.com/cncf/toc

- id: kcna-ca-028
  domain: cn-architecture
  topic: community-collaboration
  difficulty: easy
  question: For roughly how long does each Kubernetes minor release (1.19 and newer) receive patch releases?
  options:
    A: "About 3 months"
    B: "About 6 months"
    C: "About 1 year"
    D: "About 3 years"
  answer: C
  explanation: >
    The project maintains release branches for the three most recent minor releases, and
    Kubernetes 1.19 and newer get about one year of patch support (1.18 and older got about
    nine months). This is a support window for patches, not an API compatibility promise.
    API removals follow the separate deprecation policy.
  references:
    - https://kubernetes.io/releases/
