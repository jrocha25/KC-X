- id: kcna-ca-036
  domain: cn-architecture
  topic: community-collaboration
  difficulty: easy
  question: Which organization is the parent of the CNCF, the foundation that hosts Kubernetes?
  options:
    A: The Apache Software Foundation
    B: The Open Container Initiative
    C: The Linux Foundation
    D: The Eclipse Foundation
  answer: C
  explanation: >
    The Cloud Native Computing Foundation is part of the Linux Foundation and is the
    vendor-neutral home of Kubernetes. The OCI is a separate Linux
    Foundation project for container standards, and Apache and Eclipse are unrelated
    foundations.
  references:
    - https://www.cncf.io/about/who-we-are/
