# ---------------------------------------------------------------- core-concepts (36)

- id: kcna-kf-001
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: Which Kubernetes control plane component stores the entire state of the cluster?
  options:
    A: kube-scheduler
    B: etcd
    C: kube-controller-manager
    D: kubelet
  answer: B
  explanation: >
    etcd is a consistent, highly-available key-value store that Kubernetes uses as the
    backing store for all cluster data. Only the kube-apiserver talks to etcd directly.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/

- id: kcna-kf-002
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: What is the smallest deployable unit of computing that you can create and manage in Kubernetes?
  options:
    A: Container
    B: Node
    C: Pod
    D: Deployment
  answer: C
  explanation: >
    A Pod is the smallest deployable unit in Kubernetes. It wraps one or more containers
    that share network and storage and are always co-scheduled on the same node.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/

- id: kcna-kf-003
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    Which component exposes the Kubernetes API and acts as the front end through which
    users, the CLI and all other components interact with the cluster?
  options:
    A: kube-apiserver
    B: kube-proxy
    C: etcd
    D: cloud-controller-manager
  answer: A
  explanation: >
    The kube-apiserver is the front end of the control plane. kubectl, controllers, the
    scheduler and kubelets all read and write cluster state through it.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/

- id: kcna-kf-004
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: What is the main responsibility of the kubelet?
  options:
    A: "Choosing which node each newly created Pod should be placed on"
    B: "Maintaining the iptables or nftables rules that route Service traffic"
    C: "Persisting the desired state of all cluster objects in a key-value store"
    D: "Ensuring the containers in PodSpecs are running and healthy on its own node"
  answer: D
  explanation: >
    The kubelet is an agent on every node. It takes PodSpecs (mostly from the API server)
    and ensures the containers described in them are running and healthy, via the
    container runtime. Scheduling is done by kube-scheduler; Service rules by kube-proxy.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/

- id: kcna-kf-005
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: Which statement best describes how Kubernetes controllers work?
  options:
    A: "They run a single time when an object is created and then exit"
    B: "They execute imperative kubectl commands strictly in the order received"
    C: "They watch the cluster and act to move current state toward desired state"
    D: "They run inside every container and restart the main process when it crashes"
  answer: C
  explanation: >
    Controllers are control loops. Each one watches the shared state through the API
    server and makes changes to drive the current state toward the desired state
    declared in object specs (reconciliation).
  references:
    - https://kubernetes.io/docs/concepts/architecture/controller/

- id: kcna-kf-006
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: Which of the following Kubernetes objects is NOT namespaced?
  options:
    A: Node
    B: Service
    C: ConfigMap
    D: Pod
  answer: A
  explanation: >
    Nodes, PersistentVolumes, StorageClasses and Namespaces themselves are cluster-scoped.
    Pods, Services, ConfigMaps, Deployments and most workload objects live inside a
    namespace. `kubectl api-resources --namespaced=false` lists cluster-scoped kinds.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/

- id: kcna-kf-007
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: When you create a Deployment, which object does the Deployment controller create directly to manage the Pods?
  options:
    A: StatefulSet
    B: ReplicaSet
    C: DaemonSet
    D: ReplicationController
  answer: B
  explanation: >
    A Deployment manages ReplicaSets, and each ReplicaSet maintains a stable set of Pod
    replicas. During a rolling update the Deployment creates a new ReplicaSet and scales
    the old one down.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-kf-008
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    You need a log-collection agent to run exactly one Pod on every node in the cluster,
    including nodes added later. Which workload resource fits best?
  options:
    A: Deployment
    B: Job
    C: StatefulSet
    D: DaemonSet
  answer: D
  explanation: >
    A DaemonSet ensures that all (or selected) nodes run a copy of a Pod. When nodes join
    the cluster, Pods are added to them automatically — ideal for node-level agents such as
    log collectors and monitoring exporters.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/

- id: kcna-kf-009
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    A database cluster needs each replica to keep a stable network identity (for example
    db-0, db-1) and its own persistent volume across rescheduling. Which workload resource
    should you use?
  options:
    A: StatefulSet
    B: Deployment
    C: ReplicaSet
    D: DaemonSet
  answer: A
  explanation: >
    StatefulSets give each Pod a sticky, ordinal identity and, through
    volumeClaimTemplates, a dedicated PersistentVolumeClaim that follows the Pod when it is
    rescheduled. Deployments treat Pods as interchangeable.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/

- id: kcna-kf-010
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: Which resource runs a task to completion on a repeating schedule, such as a nightly backup?
  options:
    A: Job
    B: DaemonSet
    C: CronJob
    D: Deployment
  answer: C
  explanation: >
    A CronJob creates Jobs on a repeating schedule written in cron format. A Job alone runs
    Pods to completion once.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/

- id: kcna-kf-011
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: How does a Service determine which Pods should receive its traffic?
  options:
    A: By the Pod names listed in the Service spec
    B: By a label selector matching the Pods' labels
    C: "By the node or zone where the Pods are currently running"
    D: "By the container image and tag referenced by the Pods"
  answer: B
  explanation: >
    A Service uses spec.selector, a set of label key/value pairs. Every ready Pod whose
    labels match the selector becomes an endpoint of the Service.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/

- id: kcna-kf-012
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: What is the key difference between labels and annotations?
  options:
    A: "Labels can only be set on Pods, while annotations work on any object"
    B: "Annotations are encrypted at rest in etcd, while labels are plain text"
    C: "Labels are set by users, while annotations can only be written by controllers"
    D: "Labels identify and select objects; annotations hold non-identifying metadata"
  answer: D
  explanation: >
    Labels are meant for identifying and grouping objects and are queried by selectors.
    Annotations attach arbitrary non-identifying metadata (build info, tool config,
    contact details) and cannot be used in selectors.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/

- id: kcna-kf-013
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    Which control plane component runs built-in controllers such as the node controller,
    the Job controller and the EndpointSlice controller?
  options:
    A: kube-scheduler
    B: kube-apiserver
    C: kube-controller-manager
    D: kubelet
  answer: C
  explanation: >
    kube-controller-manager compiles many logically separate controllers into a single
    binary and process. Cloud-specific controllers run separately in the
    cloud-controller-manager.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/

- id: kcna-kf-014
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: In a Deployment manifest, which field sets how many Pod copies should run?
  options:
    A: spec.replicas
    B: spec.template.replicas
    C: metadata.replicas
    D: spec.selector.count
  answer: A
  explanation: >
    spec.replicas declares the desired number of Pods (default 1). The Deployment's
    ReplicaSet keeps that many Pods matching spec.selector running.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-kf-015
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: Which apiVersion is used for a Deployment object in current Kubernetes versions?
  options:
    A: v1
    B: extensions/v1beta1
    C: batch/v1
    D: apps/v1
  answer: D
  explanation: >
    Deployments, ReplicaSets, StatefulSets and DaemonSets belong to the apps API group, so
    their apiVersion is apps/v1. Core objects like Pods and Services use v1; Jobs and
    CronJobs use batch/v1.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-kf-016
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: What does a CustomResourceDefinition (CRD) allow you to do?
  options:
    A: Replace the default container runtime
    B: "Extend the Kubernetes API with your own custom resource types"
    C: Define custom scheduling algorithms for Pods
    D: Change the storage backend from etcd to another database
  answer: B
  explanation: >
    A CRD registers a new resource type with the API server, which then serves and
    stores objects of that kind like built-in ones. Combined with a custom controller this
    forms the Operator pattern.
  references:
    - https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/

- id: kcna-kf-017
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: hard
  question: >
    You submit an apps/v1 Deployment whose spec.selector.matchLabels is app=web, but whose
    Pod template has the label app=frontend. What happens?
  options:
    A: "The Deployment is accepted, but its ReplicaSet never creates any Pods"
    B: "The Deployment is created and its selector is rewritten to match the template"
    C: "The API server rejects it because the selector does not match the labels"
    D: "The Pods are created with both labels merged so that selector and template match"
  answer: C
  explanation: >
    For apps/v1 Deployments the selector is required and must match
    spec.template.metadata.labels; otherwise validation fails and the API server rejects
    the object. The selector is also immutable after creation.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-kf-018
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    A ReplicaSet is configured with replicas set to 3. You manually delete one of its
    Pods. What happens next?
  options:
    A: The ReplicaSet creates a new Pod to get back to 3 replicas
    B: The ReplicaSet scales down to 2 replicas permanently
    C: The deleted Pod is restored from etcd with the same name and UID
    D: Nothing happens until you run kubectl rollout restart
  answer: A
  explanation: >
    The ReplicaSet controller notices that only 2 matching Pods exist while 3 are desired
    and creates a replacement Pod (with a new name and UID). This is the reconciliation
    loop in action.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/

- id: kcna-kf-053
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    A cluster has just been created and nobody has added a namespace yet. Which
    namespaces does it already contain?
  options:
    A: "default, kube-system, kube-admin and kube-dns"
    B: "default, kube-system, kube-apiserver and kube-public"
    C: "default, kube-control-plane, kube-public and kube-ingress"
    D: "default, kube-system, kube-public and kube-node-lease"
  answer: D
  explanation: >
    Kubernetes starts with four namespaces. default is for objects created without a
    namespace, kube-system holds objects created by the Kubernetes system, kube-public is
    readable by all clients, and kube-node-lease holds the Lease objects that carry node
    heartbeats. The other names are components or add-ons, not built-in namespaces.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/

- id: kcna-kf-054
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    Two containers run in the same Pod. How can the first container reach a server
    listening on port 8080 in the second one?
  options:
    A: "Through localhost:8080, because both share one network namespace"
    B: "Only through a ClusterIP Service that selects the Pod's own labels"
    C: "Through the node's IP address and a NodePort"
    D: "Through each container's own separate Pod IP address"
  answer: A
  explanation: >
    All containers in a Pod share the Pod's network namespace, including its IP address
    and port space, so they can talk to each other over localhost. A Service or NodePort is
    only needed for traffic coming from outside the Pod, and containers do not get
    separate IP addresses.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/
    - https://kubernetes.io/docs/concepts/services-networking/

- id: kcna-kf-055
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    A Pod defines two init containers and one app container. How does the kubelet start
    them?
  options:
    A: "All three containers start in parallel as soon as the Pod is scheduled"
    B: "The app container starts first, then the init containers run beside it"
    C: "The init containers run one at a time to completion, then the app starts"
    D: "Both init containers run in parallel, and the app starts once either ends"
  answer: C
  explanation: >
    Init containers always run to completion, and each one must succeed before the next
    one starts. Only when all init containers have finished does the kubelet start the
    app containers. If an init container fails, the kubelet restarts it until it succeeds
    (unless the Pod's restartPolicy is Never).
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/init-containers/

- id: kcna-kf-056
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: hard
  question: >
    You want a log-shipping helper to start before the main application container and keep
    running for the whole life of the Pod. How is a native sidecar container declared?
  options:
    A: "As an entry in spec.containers with the annotation sidecar: true"
    B: "As an entry in spec.initContainers with restartPolicy: Always"
    C: "As an entry in spec.ephemeralContainers added with kubectl debug"
    D: "As a second Pod in the same Deployment with the same labels"
  answer: B
  explanation: >
    A native sidecar is an init container whose restartPolicy is Always (stable since
    v1.33). It starts in init order but does not need to finish, keeps running for the life
    of the Pod, and is stopped only after the main containers have stopped. There is no
    sidecar annotation, ephemeral containers are for debugging, and a separate Pod does not
    share the app's network namespace or lifecycle.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/

- id: kcna-kf-057
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    You run kubectl delete deployment web with no extra flags. What happens to the
    ReplicaSets and Pods the Deployment created?
  options:
    A: "They keep running as orphans and must be deleted by hand"
    B: "They keep running until the namespace itself is deleted"
    C: "They are adopted by the kube-controller-manager and kept running"
    D: "The garbage collector deletes them using their owner references"
  answer: D
  explanation: >
    The ReplicaSets carry an owner reference to the Deployment, and the Pods to their
    ReplicaSet. By default Kubernetes uses background cascading deletion: the owner is
    removed at once and the garbage collector then deletes the dependents. Dependents are
    only left behind as orphans if you ask for it, for example with --cascade=orphan.
  references:
    - https://kubernetes.io/docs/concepts/architecture/garbage-collection/

- id: kcna-kf-058
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: In a Kubernetes object, what is the difference between the spec and status fields?
  options:
    A: "spec is the desired state you set; status is the current state the system reports"
    B: "spec is written by controllers; status is the desired state that users write"
    C: "spec holds labels and annotations; status holds the container images to run"
    D: "spec is used only for Pods; status is used only for Deployments and Services"
  answer: A
  explanation: >
    When you create an object you describe its desired state in spec. Kubernetes
    components fill in status with the object's current state, and the control plane keeps
    working to make the actual state match the spec.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/

- id: kcna-kf-059
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: hard
  question: >
    You delete a PersistentVolume, but kubectl keeps showing it as Terminating, and its
    metadata lists kubernetes.io/pv-protection. What is happening?
  options:
    A: "The API server is still copying all of the volume's data into etcd"
    B: "A finalizer blocks removal until its controller finishes cleanup"
    C: "The kubelet must restart before any volume can be deleted"
    D: "The delete failed and must be retried with a newer kubectl"
  answer: B
  explanation: >
    Deleting an object that has finalizers only sets its deletionTimestamp. The object stays
    in a terminating state until every finalizer key has been removed by the controller
    responsible for it. Here pv-protection is cleared once no Pod uses the volume, and then
    the PersistentVolume is deleted.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/

- id: kcna-kf-060
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: Which of the following is NOT a valid value of a Pod's status.phase field?
  options:
    A: "Pending"
    B: "Succeeded"
    C: "CrashLoopBackOff"
    D: "Unknown"
  answer: C
  explanation: >
    The Pod phases are Pending, Running, Succeeded, Failed and Unknown. CrashLoopBackOff
    only appears in the STATUS column of some kubectl commands when a container keeps
    failing to start; it is a display value, not a phase.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/

- id: kcna-kf-061
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    You need to run a database migration once and make sure it finishes successfully,
    retrying if its Pod fails. Which resource fits best?
  options:
    A: "A DaemonSet"
    B: "A Deployment"
    C: "A StatefulSet"
    D: "A Job"
  answer: D
  explanation: >
    A Job runs one-off tasks to completion. It creates Pods and keeps retrying them until
    the required number finish successfully. Deployments, StatefulSets and DaemonSets
    keep long-running Pods alive and restart them when they exit.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/job/

- id: kcna-kf-079
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    A new worker machine joins the cluster. Which component running on that machine
    registers it as a Node with the API server by default?
  options:
    A: kube-proxy
    B: containerd
    C: kubelet
    D: kube-controller-manager
  answer: C
  explanation: >
    With --register-node set to true (the default), the kubelet registers its own Node
    object with the API server and then keeps its status up to date. kube-proxy only
    programs Service networking rules, containerd runs containers, and
    kube-controller-manager runs in the control plane, not on the joining machine.
  references:
    - https://kubernetes.io/docs/concepts/architecture/nodes/

- id: kcna-kf-080
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    kube-scheduler has just bound a new Pod to the node worker-2. Which component then
    notices the assignment and has the Pod's containers started on worker-2?
  options:
    A: "kube-scheduler, which starts the containers right after binding"
    B: "The kubelet on worker-2, through the container runtime"
    C: "kube-controller-manager, through the ReplicaSet controller"
    D: "kube-proxy on worker-2, which also sets up the Pod network"
  answer: B
  explanation: >
    The scheduler only decides where a Pod runs and records that choice in the API. The
    kubelet on the chosen node watches for Pods bound to it and asks the container runtime
    (through the CRI) to start their containers, then reports their status. Controllers
    create Pods but don't run them, and kube-proxy handles Service traffic.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/
    - https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/

- id: kcna-kf-081
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: Which list orders these Kubernetes building blocks from the broadest to the narrowest?
  options:
    A: "Cluster, Pod, Node, Container"
    B: "Node, Cluster, Pod, Container"
    C: "Cluster, Node, Container, Pod"
    D: "Cluster, Node, Pod, Container"
  answer: D
  explanation: >
    A cluster is a set of nodes. Each node runs Pods, and each Pod wraps one or more
    containers. A Pod never spans nodes, and a container always runs inside a Pod, so the
    Pod sits between the node and the container.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/
    - https://kubernetes.io/docs/concepts/workloads/pods/

- id: kcna-kf-082
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: A Pod defines three containers. Where do these containers run?
  options:
    A: "Together on the same node, sharing the Pod's network namespace"
    B: "On up to three different nodes, chosen by the scheduler to balance load"
    C: "On separate nodes, linked by an overlay so they share one IP"
    D: "On the same node only if the Pod sets a node affinity rule"
  answer: A
  explanation: >
    The containers of a Pod are always co-located and co-scheduled on one node, and they
    share the Pod's network namespace (one IP address) and its volumes. To spread work
    across nodes you run several Pods, not several containers in one Pod.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/

- id: kcna-kf-083
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: Which two kinds of heartbeat does Kubernetes use to decide whether a node is still available?
  options:
    A: "ICMP pings from the API server and periodic writes to etcd"
    B: "Events in the default namespace and ConfigMap updates"
    C: "Updates to the Node's status and to its Lease in kube-node-lease"
    D: "gRPC calls from the kubelet to both kube-scheduler and kube-proxy"
  answer: C
  explanation: >
    Nodes send two forms of heartbeat - updates to the .status of their Node object, and
    renewals of a Lease object in the kube-node-lease namespace (each Node has one).
    Leases are small, cheap updates that let the control plane notice a failed node
    quickly without rewriting the whole Node status.
  references:
    - https://kubernetes.io/docs/concepts/architecture/nodes/#node-heartbeats
    - https://kubernetes.io/docs/concepts/architecture/leases/

- id: kcna-kf-084
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: >
    A node suddenly stops sending heartbeats. Which component sets its Ready condition to
    Unknown and, if it stays unreachable, starts evicting its Pods?
  options:
    A: "The kubelet on that node, before it shuts down"
    B: "kube-scheduler, as part of its filtering step"
    C: "etcd, when the node's Lease object expires"
    D: "The node controller in kube-controller-manager"
  answer: D
  explanation: >
    The node controller monitors node health. When a node becomes unreachable it sets the
    Ready condition to Unknown, taints the node, and after a grace period (5 minutes by
    default) triggers API-initiated eviction of its Pods. The unreachable kubelet can't
    report anything, the scheduler only places new Pods, and etcd is just storage.
  references:
    - https://kubernetes.io/docs/concepts/architecture/nodes/#node-controller

- id: kcna-kf-085
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: medium
  question: What does the kubelet mainly work from to decide which containers should be running on its node?
  options:
    A: "PodSpecs of Pods bound to its node, mostly via the API server"
    B: "The Deployment objects of every namespace across the whole cluster"
    C: "The list of images already cached on the node's disk"
    D: "The scheduler's queue of Pods that are still Pending"
  answer: A
  explanation: >
    The kubelet works in terms of PodSpecs. It receives the specs of the Pods assigned to
    its node (mainly from the API server, plus static Pod manifests) and makes sure the
    containers they describe are running and healthy. It doesn't read Deployments, which
    controllers handle, or the scheduler's queue.
  references:
    - https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
    - https://kubernetes.io/docs/concepts/overview/components/

- id: kcna-kf-086
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: >
    Which control plane component links the cluster to a cloud provider's API, for
    example to create load balancers or remove Nodes whose VMs were deleted?
  options:
    A: kube-controller-manager
    B: cloud-controller-manager
    C: kube-apiserver
    D: kube-proxy
  answer: B
  explanation: >
    The cloud-controller-manager embeds cloud-specific control logic. Its node controller
    removes Node objects whose servers were deleted in the cloud, its route controller
    configures routes, and its service controller sets up load balancers. This lets cloud
    providers release features at their own pace, separate from kube-controller-manager.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cloud-controller/

- id: kcna-kf-087
  domain: k8s-fundamentals
  topic: core-concepts
  difficulty: easy
  question: Which of these is a control plane component rather than a node component?
  options:
    A: kubelet
    B: kube-proxy
    C: container runtime
    D: kube-scheduler
  answer: D
  explanation: >
    kube-scheduler runs in the control plane and assigns Pods to nodes. The kubelet, the
    container runtime and kube-proxy (or a network plugin that replaces it) run on every
    node to start containers and route Service traffic.
  references:
    - https://kubernetes.io/docs/concepts/overview/components/

# --------------------------------------------------------------- administration (23)

- id: kcna-kf-019
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which command lists all Pods in the kube-system namespace?
  options:
    A: kubectl get pods --all
    B: kubectl get pods -n kube-system
    C: kubectl list pods kube-system
    D: kubectl describe namespace kube-system --pods
  answer: B
  explanation: >
    The -n (or --namespace) flag scopes a kubectl command to a namespace. Use -A /
    --all-namespaces to list across every namespace.
  references:
    - https://kubernetes.io/docs/reference/kubectl/

- id: kcna-kf-020
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    Your team stores manifests in Git and wants to re-run the same command whenever a file
    changes, so Kubernetes updates existing objects instead of failing. Which command
    supports this declarative workflow?
  options:
    A: kubectl create -f manifest.yaml
    B: kubectl run -f manifest.yaml
    C: kubectl apply -f manifest.yaml
    D: kubectl replace --force -f manifest.yaml
  answer: C
  explanation: >
    kubectl apply is the declarative command: it creates objects that do not exist and
    patches those that do, so it can be run repeatedly. kubectl create fails if the object
    already exists; replace --force deletes and recreates.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/

- id: kcna-kf-021
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: By default, where does kubectl look for its cluster connection and credential configuration?
  options:
    A: /etc/kubernetes/kubectl.conf
    B: ~/.kubectl/settings.json
    C: /var/lib/kubelet/config.yaml
    D: ~/.kube/config
  answer: D
  explanation: >
    kubectl reads the kubeconfig file at $HOME/.kube/config unless the KUBECONFIG
    environment variable or the --kubeconfig flag points elsewhere.
  references:
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/

- id: kcna-kf-022
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    Your kubeconfig contains entries for a staging and a production cluster. Which command
    switches kubectl to the production context?
  options:
    A: kubectl config use-context production
    B: "kubectl context set --current production"
    C: "kubectl cluster switch --context production"
    D: "kubectl set context production --default"
  answer: A
  explanation: >
    A context ties together a cluster, a user and an optional default namespace.
    `kubectl config use-context <name>` sets the current context; `kubectl config
    get-contexts` lists them.
  references:
    - https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/

- id: kcna-kf-023
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which tool provides `init` and `join` commands to bootstrap a minimum viable Kubernetes cluster?
  options:
    A: kubectl
    B: kubeadm
    C: kubelet
    D: helm
  answer: B
  explanation: >
    kubeadm performs the actions needed to get a minimum viable, best-practice cluster up:
    `kubeadm init` sets up a control plane node and `kubeadm join` adds nodes.
  references:
    - https://kubernetes.io/docs/reference/setup-tools/kubeadm/

- id: kcna-kf-024
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    A cluster admin wants to cap the total CPU and memory, and the number of Pods, that a
    single team can use inside its namespace. Which object should be used?
  options:
    A: LimitRange
    B: PriorityClass
    C: ResourceQuota
    D: PodDisruptionBudget
  answer: C
  explanation: >
    A ResourceQuota constrains aggregate resource consumption (CPU, memory, object counts)
    per namespace. A LimitRange instead sets per-container/Pod defaults and min/max values.
  references:
    - https://kubernetes.io/docs/concepts/policy/resource-quotas/

- id: kcna-kf-025
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    Developers keep deploying containers without resource requests. Which object can
    automatically apply default requests and limits to containers in a namespace?
  options:
    A: LimitRange
    B: ResourceQuota
    C: HorizontalPodAutoscaler
    D: RuntimeClass
  answer: A
  explanation: >
    A LimitRange can set default requests/limits for containers that do not specify them,
    and enforce minimum/maximum values per container or Pod in a namespace.
  references:
    - https://kubernetes.io/docs/concepts/policy/limit-range/

- id: kcna-kf-026
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    Before patching a node's operating system you want to stop new Pods from landing on it
    and safely evict the Pods already running there. Which command does both?
  options:
    A: kubectl cordon <node>
    B: kubectl delete node <node>
    C: kubectl taint node <node> maintenance=true:NoSchedule
    D: kubectl drain <node>
  answer: D
  explanation: >
    kubectl drain first cordons the node (marks it unschedulable) and then evicts its Pods,
    respecting PodDisruptionBudgets. kubectl cordon alone only marks it unschedulable;
    `kubectl uncordon` reverses it after maintenance.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/

- id: kcna-kf-027
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: Approximately how often does the Kubernetes project ship a new minor release?
  options:
    A: "About once every month"
    B: "About once a year"
    C: "About three times a year"
    D: "About once every two years"
  answer: C
  explanation: >
    Since 2021 Kubernetes ships roughly three minor releases per year (about every 15
    weeks), and the project maintains release branches for the most recent three minor
    versions.
  references:
    - https://kubernetes.io/releases/

- id: kcna-kf-028
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which kubectl command shows documentation for the fields of a resource, for example `spec.containers` of a Pod?
  options:
    A: kubectl describe pod.spec.containers
    B: kubectl explain pod.spec.containers
    C: kubectl docs pod.spec.containers
    D: kubectl help pod.spec.containers
  answer: B
  explanation: >
    kubectl explain prints the schema documentation of a resource and its nested fields,
    straight from the API server. kubectl describe shows the live state of an existing
    object.
  references:
    - https://kubernetes.io/docs/reference/kubectl/

- id: kcna-kf-029
  domain: k8s-fundamentals
  topic: administration
  difficulty: hard
  question: >
    According to the Kubernetes version skew policy, which kubelet version is supported
    with a kube-apiserver at v1.34?
  options:
    A: v1.31 (three minor versions older)
    B: "v1.35 (only one minor version newer)"
    C: v1.36 (two minor versions newer)
    D: v1.30 (four minor versions older)
  answer: A
  explanation: >
    The kubelet must not be newer than kube-apiserver and may be up to three minor versions
    older (since v1.28; previously two). So v1.31–v1.34 kubelets are supported with a
    v1.34 API server. This is why control planes are upgraded before nodes.
  references:
    - https://kubernetes.io/releases/version-skew-policy/

- id: kcna-kf-062
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which command lists Pods with extra columns, such as the node each Pod is running on?
  options:
    A: "kubectl get pods --all"
    B: "kubectl get pods -o wide"
    C: "kubectl describe pods --short"
    D: "kubectl top pods --nodes"
  answer: B
  explanation: >
    The wide output format adds more information to kubectl get, including the node name
    and the Pod IP. --all and --short do not do this, and kubectl top shows resource usage.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/

- id: kcna-kf-063
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which command changes the Deployment web to run 5 replicas?
  options:
    A: "kubectl scale deployment/web --replicas=5"
    B: "kubectl set replicas deployment/web 5"
    C: "kubectl rollout scale deployment/web 5"
    D: "kubectl autoscale deployment/web --count=5"
  answer: A
  explanation: >
    kubectl scale sets the replica count of a Deployment, ReplicaSet or StatefulSet, and
    --replicas is required. kubectl set has no replicas subcommand, rollout has no scale
    subcommand, and kubectl autoscale creates a HorizontalPodAutoscaler instead.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_scale/

- id: kcna-kf-064
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    On a kubeadm control plane node, kube-apiserver runs from a manifest in
    /etc/kubernetes/manifests. You delete its Pod with kubectl, and it comes straight back.
    Why?
  options:
    A: "It is owned by a Deployment in kube-system that recreates it"
    B: "It is owned by a DaemonSet that targets control plane nodes"
    C: "It is a static Pod run by the kubelet from the manifest file"
    D: "The scheduler keeps a reserved copy of control plane Pods"
  answer: C
  explanation: >
    Static Pods are managed directly by the kubelet from files in its staticPodPath. The
    API server only shows a read-only mirror Pod, so deleting it with kubectl does not
    stop the static Pod. To change or remove it, edit or remove the manifest file on the
    node.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/

- id: kcna-kf-065
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: Which command checks whether you are allowed to create Deployments in the namespace dev?
  options:
    A: "kubectl get rolebindings --verb=create --resource=deployments -n dev"
    B: "kubectl describe user me --namespace dev"
    C: "kubectl rbac check deployments -n dev"
    D: "kubectl auth can-i create deployments --namespace dev"
  answer: D
  explanation: >
    kubectl auth can-i asks the API server's authorization layer whether the current user
    can perform an action, and answers yes or no. It works with any authorization mode,
    and administrators can add --as to check another user. Kubernetes has no User
    objects, and kubectl has no rbac check command.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/authorization/

- id: kcna-kf-066
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    What is the standard way to back up the state of every Kubernetes object in a
    cluster that uses etcd?
  options:
    A: "Run kubectl get all -A -o yaml from the default namespace"
    B: "Take a snapshot with etcdctl snapshot save"
    C: "Copy the kubeconfig file from each control plane node"
    D: "Export the kube-apiserver logs to object storage"
  answer: B
  explanation: >
    All Kubernetes objects are stored in etcd, and an etcd snapshot captures that whole
    state. kubectl get all only lists some resource types, a kubeconfig holds client
    credentials, and logs do not contain the object state.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/

- id: kcna-kf-067
  domain: k8s-fundamentals
  topic: administration
  difficulty: hard
  question: >
    You are upgrading a kubeadm cluster from one minor version to the next. In which
    order should you upgrade the nodes?
  options:
    A: "Control plane nodes first, one at a time, then the worker nodes"
    B: "Worker nodes first, so the control plane is never ahead of kubelets"
    C: "All nodes at once, because kubeadm doesn't allow mixed versions"
    D: "Any order, provided that you skip at most two minor versions"
  answer: A
  explanation: >
    The kubeadm upgrade workflow upgrades the primary control plane node, then any other
    control plane nodes one at a time, and then the worker nodes. The kubelet may be older
    than the API server but never newer, so workers go last. Skipping minor versions is
    not supported.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
    - https://kubernetes.io/releases/version-skew-policy/

- id: kcna-kf-088
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: >
    Which Kubernetes API level is well tested, but may still change its schema in
    incompatible ways in a later version, with migration instructions provided?
  options:
    A: Alpha
    B: Beta
    C: Stable (GA)
    D: Deprecated
  answer: B
  explanation: >
    Beta APIs (for example v2beta3) are well tested and support for the feature won't be
    dropped, but object schemas or semantics may still change incompatibly in a later beta
    or stable version. Alpha APIs may change or vanish without notice. Stable (GA) APIs
    stay available in all future releases of the major version. Deprecated is a status,
    not a stability level.
  references:
    - https://kubernetes.io/docs/reference/using-api/#api-versioning

- id: kcna-kf-089
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: Which apiVersion belongs to an alpha-level API?
  options:
    A: autoscaling/v2
    B: flowcontrol.apiserver.k8s.io/v1beta3
    C: resource.k8s.io/v1alpha3
    D: networking.k8s.io/v1
  answer: C
  explanation: >
    The version part of apiVersion tells you the stability level - names containing alpha
    (v1alpha3) are alpha, names containing beta (v1beta1) are beta, and a plain vX (v1,
    v2) is stable. Built-in alpha versions are disabled by default and must be enabled in
    the kube-apiserver configuration.
  references:
    - https://kubernetes.io/docs/reference/using-api/#api-versioning

- id: kcna-kf-090
  domain: k8s-fundamentals
  topic: administration
  difficulty: hard
  question: >
    Under the Kubernetes deprecation policy, how long must a built-in beta API version
    keep being served after it is deprecated?
  options:
    A: "9 months or 3 minor releases, whichever is longer"
    B: "Exactly 12 months, counted from the release that added it"
    C: "Until the next major Kubernetes version, such as 2.0"
    D: "Only until the next minor release, with no time minimum"
  answer: A
  explanation: >
    Beta API versions are no longer served 9 months or 3 minor releases (whichever is
    longer) after deprecation, giving users time to migrate. No rule promises "one year of
    API compatibility" - the 12-month figure people quote is the approximate patch-support
    window of a minor release. Keeping an API until the next major version is the rule for
    GA versions, and alpha versions can be removed in any release.
  references:
    - https://kubernetes.io/docs/reference/using-api/deprecation-policy/

- id: kcna-kf-091
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: >
    What does the Kubernetes deprecation policy say about removing a stable (GA) API
    version such as apps/v1?
  options:
    A: "It is removed 12 months after it is marked as deprecated"
    B: "It follows the beta rule of 3 minor releases after deprecation"
    C: "It can be removed in any release once a newer version exists"
    D: "It may be deprecated, but NOT removed within a major version"
  answer: D
  explanation: >
    GA API versions may be marked deprecated, but they must not be removed within a major
    version of Kubernetes, and there are no plans for a major version that removes stable
    APIs. Fixed removal windows apply to beta versions, and alpha versions can be dropped
    at any time.
  references:
    - https://kubernetes.io/docs/reference/using-api/deprecation-policy/

- id: kcna-kf-092
  domain: k8s-fundamentals
  topic: administration
  difficulty: easy
  question: >
    Which command changes the image of the container named nginx in the Deployment web to
    nginx:1.27, without recreating the Deployment?
  options:
    A: "kubectl edit pod web nginx=nginx:1.27"
    B: "kubectl update image deployment/web nginx:1.27"
    C: "kubectl set image deployment/web nginx=nginx:1.27"
    D: "kubectl rollout restart deployment/web nginx:1.27"
  answer: C
  explanation: >
    kubectl set image updates container images on an existing resource using
    CONTAINER_NAME=IMAGE pairs, and for a Deployment this starts a rolling update. kubectl
    has no update command, rollout restart restarts Pods but doesn't take an image, and
    web is a Deployment, not a Pod.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_set/kubectl_set_image/

- id: kcna-kf-093
  domain: k8s-fundamentals
  topic: administration
  difficulty: medium
  question: >
    You want to change a container image in a Deployment with kubectl patch. At which
    path in the Deployment object is the list of containers defined?
  options:
    A: ".spec.containers"
    B: ".spec.template.spec.containers"
    C: ".spec.template.containers"
    D: ".spec.selector.template.containers"
  answer: B
  explanation: >
    A Deployment's .spec.template is a Pod template, and a Pod template has its own spec,
    so the containers live at .spec.template.spec.containers. A patch aimed at
    .spec.containers changes nothing useful, because Deployments have no such field.
    kubectl set image avoids getting this path wrong.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - https://kubernetes.io/docs/concepts/workloads/pods/#pod-templates

# ------------------------------------------------------------------- scheduling (21)

- id: kcna-kf-030
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: easy
  question: Which component decides which node a newly created Pod should run on?
  options:
    A: kubelet
    B: kube-proxy
    C: kube-scheduler
    D: etcd
  answer: C
  explanation: >
    kube-scheduler watches for Pods with no assigned node and selects a node for each one
    by filtering infeasible nodes and scoring the remaining ones. It then writes the
    binding to the API server; the kubelet on that node starts the Pod.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/

- id: kcna-kf-031
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: easy
  question: What is the simplest way to make a Pod run only on nodes that carry the label disktype=ssd?
  options:
    A: "Add a toleration for disktype=ssd to the Pod spec"
    B: "Add a nodeSelector of disktype ssd to the Pod spec"
    C: "Set spec.nodeName to ssd in the Pod spec"
    D: "Add the label disktype=ssd to the Pod's own metadata"
  answer: B
  explanation: >
    nodeSelector is the simplest node selection constraint: the Pod is only scheduled on
    nodes that have all the listed labels. Tolerations do not attract Pods; they only allow
    them onto tainted nodes.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/

- id: kcna-kf-032
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: What is the purpose of a taint on a node?
  options:
    A: "It attracts Pods that have matching labels to the node"
    B: It marks the node as failed so it gets replaced
    C: It limits the CPU available on the node
    D: "It repels any Pods that do not have a matching toleration"
  answer: D
  explanation: >
    Taints are applied to nodes and repel Pods; tolerations are applied to Pods and allow
    (but do not force) scheduling onto nodes with matching taints. To force placement,
    combine tolerations with node affinity or nodeSelector.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

- id: kcna-kf-033
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: hard
  question: >
    A Pod uses node affinity of type requiredDuringSchedulingIgnoredDuringExecution for
    zone=us-east-1a. After the Pod is running, someone removes that label from its node.
    What happens?
  options:
    A: The Pod keeps running on the node
    B: The Pod is evicted immediately
    C: The Pod is rescheduled to another node in us-east-1a
    D: The Pod is marked as Failed but not removed
  answer: A
  explanation: >
    "requiredDuringScheduling" makes the rule mandatory when the scheduler places the Pod;
    "IgnoredDuringExecution" means label changes afterwards do not affect Pods that are
    already running.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/

- id: kcna-kf-034
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: Which container setting does kube-scheduler use to decide whether a node has enough capacity for a Pod?
  options:
    A: resources.limits
    B: The container image size
    C: resources.requests
    D: The node's current real-time CPU usage
  answer: C
  explanation: >
    The scheduler sums the resource requests of a Pod's containers and only places the Pod
    on a node whose allocatable capacity minus the requests of Pods already there can fit
    it. Limits are enforced at runtime by the kubelet and container runtime.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

- id: kcna-kf-035
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    A new Pod stays in the Pending state and its events show
    "0/3 nodes are available: 3 Insufficient cpu". What is the most likely cause?
  options:
    A: "The container image cannot be pulled from the configured registry"
    B: "The Pod requests more CPU than any node has left to allocate"
    C: "The container keeps crashing shortly after it starts on each node"
    D: "The Service selecting the Pod has no ready endpoints behind it"
  answer: B
  explanation: >
    "Insufficient cpu" is a scheduling failure: no node has enough unrequested allocatable
    CPU for the Pod's requests. Lower the request, free capacity or add nodes. Image pull
    errors and crashes happen after scheduling.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-kf-036
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    You want the replicas of a web Deployment to avoid running on the same node as each
    other, so a single node failure does not take down all of them. Which feature
    expresses this?
  options:
    A: Pod anti-affinity
    B: Node affinity
    C: A PodDisruptionBudget
    D: A ResourceQuota
  answer: A
  explanation: >
    Inter-pod anti-affinity lets you say "do not schedule this Pod on a node (or in a
    topology domain) that already runs Pods with these labels". Node affinity only
    considers node labels. Topology spread constraints are another option for even
    spreading.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/

- id: kcna-kf-037
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    Which Pod spec field lets you control how evenly Pods are spread across failure domains
    such as zones, using a maxSkew value?
  options:
    A: affinity.nodeAffinity
    B: tolerations
    C: priorityClassName
    D: topologySpreadConstraints
  answer: D
  explanation: >
    topologySpreadConstraints spread matching Pods across topology domains (zones, nodes,
    regions) identified by a node label (topologyKey). maxSkew is the maximum allowed
    difference in Pod count between domains.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/

- id: kcna-kf-038
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    The cluster is full and a critical Pod cannot be scheduled. Which mechanism can allow
    the scheduler to evict lower-priority Pods to make room for it?
  options:
    A: Node affinity
    B: PriorityClass with preemption
    C: Horizontal Pod Autoscaler
    D: LimitRange
  answer: B
  explanation: >
    Pods can be given a priority through a PriorityClass. If a high-priority Pod cannot be
    scheduled, the scheduler may preempt (evict) lower-priority Pods on a node to make room.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/

- id: kcna-kf-039
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: hard
  question: >
    You add the taint dedicated=gpu:NoExecute to a node. What happens to Pods already
    running on that node that do not tolerate the taint?
  options:
    A: They keep running; only new Pods are blocked
    B: They are restarted in place with a toleration added automatically
    C: They are evicted from the node
    D: They are paused until the taint is removed
  answer: C
  explanation: >
    NoSchedule only affects new scheduling and PreferNoSchedule is a soft version. The
    NoExecute effect also evicts running Pods that do not tolerate the taint (optionally
    after tolerationSeconds if they do tolerate it).
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

- id: kcna-kf-040
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    In a kubeadm cluster, ordinary application Pods are not scheduled onto control plane
    nodes. What normally prevents this?
  options:
    A: "Control plane nodes do not run a kubelet at all"
    B: "The scheduler is hard-coded to skip any node named master"
    C: "Control plane nodes do not have a container runtime"
    D: "A NoSchedule taint on the control plane nodes"
  answer: D
  explanation: >
    kubeadm taints control plane nodes with node-role.kubernetes.io/control-plane:NoSchedule.
    Only Pods that tolerate this taint (such as some system components) are scheduled
    there. Removing the taint allows regular workloads on them.
  references:
    - https://kubernetes.io/docs/reference/labels-annotations-taints/
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

- id: kcna-kf-068
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: easy
  question: >
    Which taint effect tells the scheduler to try to avoid a node for Pods that do not
    tolerate the taint, without guaranteeing it?
  options:
    A: "NoSchedule"
    B: "NoExecute"
    C: "PreferNoSchedule"
    D: "AvoidSchedule"
  answer: C
  explanation: >
    PreferNoSchedule is the soft version of NoSchedule: the control plane tries not to place
    non-tolerating Pods on the node but may still do so. NoSchedule is a hard rule for new
    Pods, NoExecute also evicts running Pods, and AvoidSchedule does not exist.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

- id: kcna-kf-069
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: easy
  question: In which two steps does kube-scheduler choose a node for a Pod?
  options:
    A: "Admission, then validation"
    B: "Binding, then preemption"
    C: "Draining, then cordoning"
    D: "Filtering, then scoring"
  answer: D
  explanation: >
    Filtering finds the nodes where the Pod could run, for example those with enough free
    resources for its requests. Scoring then ranks the remaining nodes, and the Pod is
    bound to the highest-scoring one. If filtering leaves no nodes, the Pod stays
    unscheduled.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/

- id: kcna-kf-070
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: Which Pod gets the Guaranteed quality of service (QoS) class?
  options:
    A: "One whose containers set no CPU or memory requests or limits"
    B: "One where each container sets CPU and memory limits equal to its requests"
    C: "One where at least one container sets a memory request"
    D: "One where all containers set limits that are larger than their requests"
  answer: B
  explanation: >
    A Pod is Guaranteed when every container has CPU and memory requests and limits, and
    the limits equal the requests. With no requests or limits it is BestEffort, and any
    other combination, such as some requests or limits above requests, makes it
    Burstable.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/

- id: kcna-kf-071
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    A node runs out of memory and the kubelet must evict Pods. Which QoS class is
    evicted first?
  options:
    A: "BestEffort"
    B: "Burstable"
    C: "Guaranteed"
    D: "The Pod with the newest creation time, whatever its class"
  answer: A
  explanation: >
    Under node pressure Kubernetes evicts BestEffort Pods first, then Burstable Pods, and
    Guaranteed Pods last. This is one reason to give important workloads requests and
    limits.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/

- id: kcna-kf-072
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: A Pod spec sets nodeName to worker-2. How does this affect scheduling?
  options:
    A: "The scheduler treats worker-2 as a preference and may pick another node"
    B: "The scheduler checks taints first, then binds the Pod to worker-2"
    C: "The scheduler ignores the Pod, and the kubelet on worker-2 tries to run it"
    D: "The scheduler rejects the Pod, because nodeName is reserved for static Pods"
  answer: C
  explanation: >
    When nodeName is set, the scheduler skips the Pod and the named node's kubelet tries
    to run it, overriding nodeSelector and affinity rules. If the node lacks resources, the
    Pod fails (for example with OutOfcpu) instead of moving elsewhere. Node affinity or
    nodeSelector are preferred because they do not bypass the scheduler.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/

- id: kcna-kf-094
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    A container sets a memory limit of 256Mi. What actually enforces that limit while the
    container runs on a Linux node?
  options:
    A: "kube-scheduler, which checks container usage every few seconds"
    B: "The ResourceQuota controller in kube-controller-manager"
    C: "kube-apiserver, which rejects writes once the limit is reached"
    D: "The kernel's cgroups, set up by the kubelet and runtime"
  answer: D
  explanation: >
    The kubelet passes requests and limits to the container runtime, which configures
    Linux cgroups. The kernel then enforces them - CPU by throttling, memory with OOM
    kills. The scheduler only uses requests for placement, and ResourceQuota caps totals
    per namespace at admission time.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

- id: kcna-kf-095
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: easy
  question: A container repeatedly tries to use more CPU than its CPU limit. What happens?
  options:
    A: "It is throttled, so it keeps running but gets no more CPU"
    B: "It is OOMKilled by the kernel and restarted by the kubelet"
    C: "It is evicted at once and rescheduled onto a larger node"
    D: "Its limit is raised automatically to match the demand"
  answer: A
  explanation: >
    A CPU limit is a hard ceiling enforced by CPU throttling - the container is slowed
    down, not killed. Exceeding a memory limit is different and can lead to an OOM kill.
    Kubernetes never raises a limit by itself.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

- id: kcna-kf-096
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: hard
  question: >
    A container requests 128Mi of memory and has a 512Mi limit. It now uses 300Mi on a
    node with plenty of free memory. What happens?
  options:
    A: "It is OOMKilled because it used more memory than it requested"
    B: "It is throttled back down to 128Mi by the kubelet"
    C: "Nothing - it may use more than its request, up to the limit"
    D: "It is evicted because its QoS class is now Guaranteed"
  answer: C
  explanation: >
    A request is what the scheduler reserves, not a cap. If the node has spare resources,
    a container may use more than its request, up to its limit. Memory can't be throttled,
    and a Pod with request lower than limit is Burstable, not Guaranteed.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

- id: kcna-kf-097
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: hard
  question: >
    Monitoring shows a node at only 20% real CPU use, yet a new Pod with a CPU request
    stays Pending with "Insufficient cpu" for that node. What is the most likely reason?
  options:
    A: "Monitoring data lags, so the scheduler waits for the next sample"
    B: "The CPU requests of Pods already on the node fill its allocatable CPU"
    C: "The Pod's CPU limit is higher than the node's total CPU capacity"
    D: "kube-proxy reserves the node's idle CPU for Service traffic"
  answer: B
  explanation: >
    kube-scheduler compares the sum of the requests of Pods already placed on a node with
    the node's allocatable capacity, not with live usage. If existing Pods requested most
    of the CPU but use little, the node still counts as full for new requests. Lowering
    oversized requests or adding nodes fixes it.
  references:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    - https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/

- id: kcna-kf-098
  domain: k8s-fundamentals
  topic: scheduling
  difficulty: medium
  question: >
    A Pod sets spec.schedulerName to my-scheduler, but no scheduler with that name is
    running in the cluster. What happens to the Pod?
  options:
    A: "It stays Pending until a scheduler with that name starts"
    B: "The default scheduler picks it up after a short timeout"
    C: "The API server rejects it because the scheduler is unknown"
    D: "The kubelet on a random node starts it with no scheduling"
  answer: A
  explanation: >
    Each scheduler only handles Pods whose spec.schedulerName matches one of its profiles.
    Pods without the field use default-scheduler. A Pod naming a scheduler that isn't
    running is never picked up by the default scheduler and stays Pending until that
    scheduler runs.
  references:
    - https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/

# -------------------------------------------------------------- containerization (24)

- id: kcna-kf-041
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: What is the relationship between a container image and a container?
  options:
    A: A container is a read-only template; an image is a running instance of it
    B: "An image is a read-only package; a container is a running instance of that image"
    C: "They are two different names for exactly the same object"
    D: An image is a virtual machine disk; a container is the VM
  answer: B
  explanation: >
    A container image is an immutable, layered package containing the application and
    everything needed to run it. A container is a runtime instance created from an image,
    with a thin writable layer on top.
  references:
    - https://kubernetes.io/docs/concepts/containers/

- id: kcna-kf-042
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which organization maintains open standards for container image formats and runtimes?
  options:
    A: Open Container Initiative (OCI)
    B: Cloud Native Computing Foundation Technical Oversight Committee
    C: Internet Engineering Task Force (IETF)
    D: Kubernetes SIG Node
  answer: A
  explanation: >
    The OCI, a Linux Foundation project, publishes the Image Specification, Runtime
    Specification and Distribution Specification so that images and runtimes from different
    vendors interoperate.
  references:
    - https://opencontainers.org/

- id: kcna-kf-043
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which interface does the kubelet use to talk to container runtimes such as containerd or CRI-O?
  options:
    A: CNI (Container Network Interface)
    B: CSI (Container Storage Interface)
    C: CRI (Container Runtime Interface)
    D: SMI (Service Mesh Interface)
  answer: C
  explanation: >
    The CRI is a gRPC API between the kubelet and the container runtime. It lets
    Kubernetes use any compliant runtime without recompiling. CNI is for networking and CSI
    for storage.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cri/

- id: kcna-kf-044
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which of the following is NOT a container runtime?
  options:
    A: containerd
    B: CRI-O
    C: runc
    D: Helm
  answer: D
  explanation: >
    Helm is a package manager for Kubernetes manifests (charts). containerd and CRI-O are
    high-level CRI runtimes, and runc is the low-level OCI runtime that actually creates
    containers.
  references:
    - https://kubernetes.io/docs/setup/production-environment/container-runtimes/

- id: kcna-kf-045
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    The dockershim component was removed from the kubelet in Kubernetes v1.24. What does
    this mean in practice?
  options:
    A: "Container images built with Docker can no longer run on any Kubernetes cluster"
    B: "Nodes need a CRI runtime such as containerd or CRI-O, not Docker Engine directly"
    C: "Kubernetes now ships and maintains its own built-in container runtime on every node"
    D: Docker Compose files can be applied directly with kubectl
  answer: B
  explanation: >
    Dockershim let the kubelet talk to Docker Engine, which does not implement the CRI.
    After its removal, nodes use a CRI runtime (containerd, CRI-O, or Docker via the
    external cri-dockerd adapter). Images built with Docker are OCI images and still work.
  references:
    - https://kubernetes.io/blog/2022/02/17/dockershim-faq/

- id: kcna-kf-046
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: Which Linux kernel features are the foundation of container isolation and resource limiting?
  options:
    A: "SELinux and AppArmor security profiles"
    B: "iptables and IPVS packet filtering rules"
    C: "Hypervisors and hardware virtual CPUs"
    D: Namespaces and control groups (cgroups)
  answer: D
  explanation: >
    Namespaces isolate what a process can see (PIDs, network, mounts, users, etc.), and
    cgroups limit and account for the resources it can use (CPU, memory, I/O). SELinux and
    AppArmor add security hardening on top.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cgroups/

- id: kcna-kf-047
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    Your Go service image is 1 GB because it includes the whole compiler toolchain. Which
    Dockerfile technique is the standard way to ship only the compiled binary?
  options:
    A: "A multi-stage build that copies only the binary into a small final image"
    B: "Adding RUN instructions at the end of the Dockerfile to delete the toolchain"
    C: "Using the latest tag of the golang base image to get smaller layers"
    D: Running the build inside the Kubernetes Pod at startup
  answer: A
  explanation: >
    Multi-stage builds use several FROM stages; the final stage copies only the needed
    artifacts (COPY --from=build) onto a small base image. Deleting files in a later RUN
    does not shrink earlier layers.
  references:
    - https://docs.docker.com/build/building/multi-stage/

- id: kcna-kf-048
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    Why might a team reference an image as registry.example.com/app@sha256:<digest>
    instead of registry.example.com/app:1.4?
  options:
    A: "Images pulled by digest download faster because their layers are cached"
    B: "Tags are not supported by containerd or CRI-O, only by Docker Engine"
    C: "A digest pins the exact image content; a tag can be moved to another image"
    D: "A digest always resolves to the newest version pushed to the registry"
  answer: C
  explanation: >
    A tag is a mutable pointer that can be re-pushed to point at different content. A
    digest is a content hash, so pulling by digest always yields the same bytes — useful
    for reproducibility and supply-chain security.
  references:
    - https://kubernetes.io/docs/concepts/containers/images/

- id: kcna-kf-049
  domain: k8s-fundamentals
  topic: containerization
  difficulty: hard
  question: >
    A container spec uses image nginx:latest and does not set imagePullPolicy. Which pull
    policy does Kubernetes apply by default?
  options:
    A: IfNotPresent
    B: Always
    C: Never
    D: OnFailure
  answer: B
  explanation: >
    When imagePullPolicy is omitted, Kubernetes sets it to Always if the tag is :latest or
    the tag is omitted, and to IfNotPresent for any other tag. OnFailure is a restartPolicy
    value, not a pull policy.
  references:
    - https://kubernetes.io/docs/concepts/containers/images/

- id: kcna-kf-050
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: What role does runc play in a typical containerd-based Kubernetes node?
  options:
    A: "It decides which Pods should be scheduled onto the node"
    B: "It is the high-level daemon the kubelet talks to over the CRI gRPC API"
    C: "It pushes and stores image layers in the container registry"
    D: "It is the low-level OCI runtime that actually creates the container processes"
  answer: D
  explanation: >
    The kubelet talks to containerd over the CRI. containerd manages images and container
    lifecycle and delegates the actual creation of containers (namespaces, cgroups) to a
    low-level OCI runtime, commonly runc.
  references:
    - https://github.com/opencontainers/runc
    - https://kubernetes.io/docs/setup/production-environment/container-runtimes/

- id: kcna-kf-051
  domain: k8s-fundamentals
  topic: containerization
  difficulty: hard
  question: >
    A platform team wants some untrusted workloads to run with a sandboxed runtime such as
    gVisor or Kata Containers while other Pods keep the default runtime. Which Kubernetes
    feature lets a Pod choose its runtime configuration?
  options:
    A: RuntimeClass, referenced by runtimeClassName in the Pod spec
    B: PriorityClass, referenced by priorityClassName in the Pod spec
    C: StorageClass, referenced by a PersistentVolumeClaim
    D: An annotation on the Namespace
  answer: A
  explanation: >
    A RuntimeClass maps a name to a runtime handler configured on the nodes. Pods select
    it with spec.runtimeClassName, so different Pods in the same cluster can use different
    runtimes (e.g. runc vs gVisor/Kata).
  references:
    - https://kubernetes.io/docs/concepts/containers/runtime-class/

- id: kcna-kf-052
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Compared to virtual machines, what is a defining characteristic of containers?
  options:
    A: Each container runs its own full guest operating system kernel
    B: Containers can only run on bare metal
    C: Containers share the host operating system kernel
    D: Containers require a hypervisor to start
  answer: C
  explanation: >
    Containers are isolated processes that share the host kernel, which makes them lighter
    and faster to start than VMs, each of which boots its own guest kernel on a hypervisor.
  references:
    - https://kubernetes.io/docs/concepts/overview/

- id: kcna-kf-073
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Where is a container image usually stored so that nodes can pull it when a Pod starts?
  options:
    A: "In etcd, next to the Pod object that uses it"
    B: "In a ConfigMap in the kube-system namespace"
    C: "In the kubelet's configuration file on every node"
    D: "In a container registry, such as a private registry"
  answer: D
  explanation: >
    You build an image and push it to a registry before referencing it in a Pod. The image
    name can include the registry host, and if it does not, Kubernetes assumes the Docker
    public registry. etcd and ConfigMaps store API objects, not image contents.
  references:
    - https://kubernetes.io/docs/concepts/containers/images/

- id: kcna-kf-074
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: >
    Your Pod uses an image from a private registry that requires a login. How does the
    Pod give the kubelet the registry credentials?
  options:
    A: "By listing a docker-registry type Secret under imagePullSecrets"
    B: "By setting the registry password in a container environment variable"
    C: "By adding the credentials to the image tag after an @ sign"
    D: "By mounting a ConfigMap at /root/.docker in the container"
  answer: A
  explanation: >
    Registry credentials are stored in a Secret of type kubernetes.io/dockerconfigjson
    (created with kubectl create secret docker-registry), and the Pod refers to it in
    spec.imagePullSecrets. Environment variables are only visible inside the container,
    which starts after the image has been pulled.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/

- id: kcna-kf-075
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: >
    A container writes files to its own filesystem, outside any volume, and then
    crashes. What happens to those files when the kubelet restarts it?
  options:
    A: "They are copied into the restarted container automatically"
    B: "They are lost, because the restarted container starts clean"
    C: "They are saved in etcd until the Pod is deleted"
    D: "They are moved to the node's /tmp directory"
  answer: B
  explanation: >
    On-disk files in a container are ephemeral. When a container crashes or stops, its
    files are lost and the kubelet restarts it with a clean state. To keep data across
    container restarts, write it to a volume.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/

- id: kcna-kf-076
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: What does the OCI Runtime Specification define?
  options:
    A: "The configuration, execution environment and lifecycle of a container"
    B: "The format of image manifests, image indexes and filesystem layer archives"
    C: "The API that kubectl uses to talk to the kube-apiserver"
    D: "The plugin interface that sets up Pod network interfaces"
  answer: A
  explanation: >
    The Open Container Initiative's runtime spec covers how a container is configured,
    the environment it runs in and its lifecycle. Low-level runtimes such as runc
    implement it. Image formats are covered by the separate OCI Image Spec, and Pod
    networking by CNI.
  references:
    - https://github.com/opencontainers/runtime-spec/blob/main/spec.md

- id: kcna-kf-077
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    An image defines ENTRYPOINT ["/app/server"] and CMD ["--port=80"]. The Pod's
    container sets args to ["--port=9090"] but sets no command. What runs?
  options:
    A: "Only --port=9090, because args replaces the whole startup line"
    B: "/app/server --port=80, because args is ignored without a command"
    C: "/app/server --port=80 --port=9090, because args is appended to CMD"
    D: "/app/server --port=9090, because args replaces only CMD"
  answer: D
  explanation: >
    The Pod's command field corresponds to the image ENTRYPOINT and args to CMD. If you set
    args but no command, the image's default command runs with your new arguments. Setting
    command would replace the ENTRYPOINT as well.
  references:
    - https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/

- id: kcna-kf-078
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    You are logged in to a node that runs containerd and want to list the containers on
    it directly through the CRI. Which tool is designed for this?
  options:
    A: "kubeadm"
    B: "crictl"
    C: "kubectl"
    D: "etcdctl"
  answer: B
  explanation: >
    crictl is a command-line interface for CRI-compatible runtimes, used to inspect and
    debug runtimes and containers on a node (crictl ps, crictl images, crictl logs). kubectl
    talks to the API server, kubeadm bootstraps clusters, and etcdctl manages etcd.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/

- id: kcna-kf-099
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which project is the reference implementation of the OCI Runtime Specification?
  options:
    A: runc
    B: CRI-O
    C: containerd
    D: crun
  answer: A
  explanation: >
    runc, donated by Docker to the OCI, is the reference implementation of the OCI runtime
    spec. It's a low-level CLI that spawns and runs containers. crun is another OCI
    runtime written in C, but not the reference one. containerd and CRI-O are high-level
    runtimes that implement the Kubernetes CRI and call a low-level OCI runtime such as
    runc.
  references:
    - https://github.com/opencontainers/runtime-spec/blob/main/implementations.md
    - https://github.com/opencontainers/runc

- id: kcna-kf-100
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which three specifications does the Open Container Initiative (OCI) maintain?
  options:
    A: "Runtime, Network and Storage"
    B: "Image, Build and Registry Auth"
    C: "Runtime, Scheduling and Logging"
    D: "Runtime, Image and Distribution"
  answer: D
  explanation: >
    The OCI maintains the Runtime Specification (how to run a filesystem bundle), the
    Image Specification (image format) and the Distribution Specification (how registries
    serve content). Networking is covered by CNI and storage by CSI, which are not OCI
    specs.
  references:
    - https://opencontainers.org/about/overview/

- id: kcna-kf-101
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: How do CRI-O and runc work together on a Kubernetes node?
  options:
    A: "runc implements the CRI for the kubelet and hands images to CRI-O"
    B: "CRI-O serves the kubelet's CRI calls and uses runc to start containers"
    C: "CRI-O is an image registry, and runc pulls images from it for the kubelet"
    D: "Both are CNI plugins that give Pods their network interfaces"
  answer: B
  explanation: >
    CRI-O is an implementation of the Kubernetes Container Runtime Interface. It receives
    the kubelet's gRPC calls, manages images and Pod sandboxes, and calls an OCI runtime
    to create the containers - runc by default. runc doesn't speak CRI, and neither project
    is a registry or a CNI plugin.
  references:
    - https://cri-o.io/
    - https://kubernetes.io/docs/setup/production-environment/container-runtimes/

- id: kcna-kf-102
  domain: k8s-fundamentals
  topic: containerization
  difficulty: easy
  question: Which protocol does the Container Runtime Interface (CRI) use between the kubelet and the runtime?
  options:
    A: REST over HTTPS
    B: SSH
    C: gRPC
    D: AMQP
  answer: C
  explanation: >
    The CRI defines a gRPC protocol. The kubelet acts as the gRPC client and connects to
    the runtime's endpoint (a Unix socket set by --container-runtime-endpoint). This lets
    the kubelet use any compliant runtime without recompiling.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cri/

- id: kcna-kf-103
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    The same image reference, app:2.1, is pulled by amd64 and by arm64 nodes, and each gets
    a variant built for its CPU. What makes this possible?
  options:
    A: "The kubelet recompiles the image for the node's CPU"
    B: "A RuntimeClass emulates one architecture on the other"
    C: "The registry converts layers on the fly during the pull"
    D: "An OCI image index that lists one manifest per platform"
  answer: D
  explanation: >
    An image index is a higher-level manifest that points to platform-specific image
    manifests. The runtime picks the entry that matches the node's OS and architecture.
    Nothing recompiles or converts the image, and RuntimeClass selects a runtime handler,
    not a CPU architecture.
  references:
    - https://github.com/opencontainers/image-spec/blob/main/image-index.md

- id: kcna-kf-104
  domain: k8s-fundamentals
  topic: containerization
  difficulty: medium
  question: >
    A kubelet runs with --container-runtime-endpoint=unix:///run/containerd/containerd.sock.
    What does this setting point to?
  options:
    A: "The CNI configuration directory used for Pod networking"
    B: "The API server endpoint that the kubelet reports node status to"
    C: "The CRI gRPC socket the kubelet uses to talk to the runtime"
    D: "A local registry mirror that caches images for the node"
  answer: C
  explanation: >
    The kubelet is a gRPC client of the container runtime. The runtime and image service
    endpoints are set with --container-runtime-endpoint (or containerRuntimeEndpoint in the
    kubelet config file), usually a Unix socket such as containerd's. If the runtime behind
    that socket is down, the kubelet can't launch Pods.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cri/
    - https://kubernetes.io/docs/setup/production-environment/container-runtimes/
