name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Validate questions + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/validate_questions.py
      - run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kcx:ci .

  links:
    name: Reference links (non-blocking)
    runs-on: ubuntu-latest
    # External sites go down or rate-limit CI runners; report, but never block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python scripts/check_links.py
