# --------------------------------------------------------- application-delivery (27)

- id: kcna-ad-001
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: Which statement reflects a core GitOps principle as defined by the OpenGitOps project?
  options:
    A: "Engineers apply each change to production with kubectl from their own laptops"
    B: "Desired state is declared in Git, pulled by agents and continuously reconciled"
    C: "CI pipelines push every new version directly into the cluster with admin credentials"
    D: Configuration is stored in a database and edited through a web UI only
  answer: B
  explanation: >
    The four OpenGitOps principles are - declarative, versioned and immutable, pulled
    automatically, and continuously reconciled. Agents in the environment pull the desired
    state and correct any drift.
  references:
    - https://opengitops.dev/

- id: kcna-ad-002
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: Argo CD and Flux are best described as what kind of tools?
  options:
    A: "Container runtimes that implement the Kubernetes CRI"
    B: "Service meshes for east-west traffic management"
    C: GitOps continuous delivery tools for Kubernetes
    D: "Time-series databases for cluster metrics"
  answer: C
  explanation: >
    Argo CD and Flux are CNCF graduated projects that keep a Kubernetes cluster in sync with
    configuration stored in Git (or OCI repositories).
  references:
    - https://argo-cd.readthedocs.io/
    - https://fluxcd.io/

- id: kcna-ad-003
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: In Helm, what is a chart?
  options:
    A: "A package of templated Kubernetes manifests and their default values"
    B: "A dashboard that graphs the release's resource usage over time"
    C: "A running instance of a packaged application inside the cluster"
    D: A container image stored in a registry
  answer: A
  explanation: >
    A chart is a Helm package - Chart.yaml metadata, templates and a values.yaml file. Installing a
    chart into a cluster creates a release; each upgrade creates a new revision.
  references:
    - https://helm.sh/docs/intro/using_helm/

- id: kcna-ad-004
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: An upgrade of the Helm release shop broke the application. Which command returns it to revision 3?
  options:
    A: helm undo shop 3
    B: helm upgrade shop --revision 3
    C: helm restore shop 3
    D: helm rollback shop 3
  answer: D
  explanation: >
    helm rollback <release> <revision> rolls a release back to an earlier revision; helm
    history <release> lists the available revisions.
  references:
    - https://helm.sh/docs/helm/helm_rollback/

- id: kcna-ad-005
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: How does Kustomize customize Kubernetes manifests for different environments?
  options:
    A: "By rendering Go templates with values supplied in a values.yaml file"
    B: "By applying patches and overlays to plain YAML, with no templates"
    C: "By generating manifests at deploy time from a Python script"
    D: "By storing a separate copy of each environment's manifests in etcd"
  answer: B
  explanation: >
    Kustomize is template-free - a kustomization.yaml lists base resources and applies
    overlays, patches, name prefixes, labels and generators. It is built into kubectl via
    kubectl apply -k.
  references:
    - https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/

- id: kcna-ad-006
  domain: app-delivery
  topic: application-delivery
  difficulty: hard
  question: >
    A Deployment has 4 replicas and uses the RollingUpdate strategy with maxSurge 25% and
    maxUnavailable 25%. During an update, what are the maximum total Pods and the minimum
    available Pods?
  options:
    A: At most 5 Pods in total, at least 3 available
    B: At most 4 Pods in total, at least 4 available
    C: At most 6 Pods in total, at least 2 available
    D: At most 8 Pods in total, at least 0 available
  answer: A
  explanation: >
    maxSurge is rounded up - 25% of 4 is 1, so at most 4 + 1 = 5 Pods. maxUnavailable is
    rounded down - 25% of 4 is 1, so at least 4 - 1 = 3 Pods stay available. 25%/25% are
    also the defaults.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-ad-007
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: >
    The new version of an application cannot run alongside the old one because of an
    incompatible schema change. Which Deployment strategy kills all old Pods before
    creating new ones?
  options:
    A: RollingUpdate
    B: Canary
    C: Recreate
    D: OnDelete
  answer: C
  explanation: >
    The Recreate strategy terminates all existing Pods before new ones are created, which
    causes downtime but avoids running two versions at once. RollingUpdate is the default.
    OnDelete is a StatefulSet and DaemonSet strategy.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-ad-008
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: Which command reverts the Deployment web to its previous revision?
  options:
    A: kubectl rollout undo deployment/web
    B: kubectl rollback deployment/web
    C: kubectl delete deployment/web --previous
    D: kubectl apply --undo deployment/web
  answer: A
  explanation: >
    kubectl rollout undo returns a Deployment to the previous revision (or to a specific
    one with --to-revision). kubectl rollout history lists revisions.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-ad-009
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: Which description matches a blue/green deployment?
  options:
    A: "New Pods gradually replace old Pods a few at a time until all are updated"
    B: A small percentage of users is routed to the new version while metrics are watched
    C: All old Pods are stopped before any new Pod starts
    D: "Two full environments run side by side and traffic switches over at once"
  answer: D
  explanation: >
    Blue/green keeps the current (blue) and new (green) versions fully deployed and flips
    traffic between them, for example by changing a Service selector. Rollback is just
    switching back.
  references:
    - https://glossary.cncf.io/blue-green-deployment/

- id: kcna-ad-010
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: What is a canary deployment?
  options:
    A: "Releasing to a small share of traffic first, then expanding if healthy"
    B: "Running old and new versions side by side, then switching all traffic at once"
    C: Running a deployment in a separate cluster used only for testing
    D: "Deploying every microservice at the same time in one coordinated release"
  answer: A
  explanation: >
    A canary release sends a small share of traffic to the new version and watches error
    rates and latency before promoting it to everyone. Tools such as Argo Rollouts and
    Flagger automate this.
  references:
    - https://glossary.cncf.io/canary-deployment/
    - https://kubernetes.io/docs/concepts/workloads/management/

- id: kcna-ad-011
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: What is the main goal of continuous integration (CI)?
  options:
    A: "Automatically scaling Pods up and down based on the current load"
    B: "Merging changes often and building and testing each one automatically"
    C: "Encrypting all traffic between services using automatically rotated mutual TLS"
    D: "Collecting and storing application logs for long-term analysis"
  answer: B
  explanation: >
    CI integrates developers' changes into a shared branch often, with every change built
    and tested automatically so problems are found early. Continuous delivery extends this
    so every validated change can be released.
  references:
    - https://glossary.cncf.io/continuous-integration/

- id: kcna-ad-012
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    You create a HorizontalPodAutoscaler that targets 70% CPU utilization, but it reports
    the current utilization as unknown. What is a common missing prerequisite?
  options:
    A: "metrics-server (or another resource metrics API provider)"
    B: "A LoadBalancer Service exposing the target Deployment"
    C: "A StatefulSet as the scale target, because Deployments cannot be autoscaled"
    D: "A PersistentVolumeClaim where the HPA stores its history"
  answer: A
  explanation: >
    The HPA reads CPU and memory usage from the resource metrics API, typically provided by
    metrics-server. The target Pods also need CPU requests, because utilization is computed
    as a percentage of the request.
  references:
    - https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/

- id: kcna-ad-013
  domain: app-delivery
  topic: application-delivery
  difficulty: hard
  question: >
    Compared with a CI pipeline that pushes manifests into the cluster, what is a key
    security benefit of the pull-based model used by GitOps agents?
  options:
    A: "Container images no longer need to be signed or scanned"
    B: "RBAC is no longer needed for anything inside the cluster"
    C: "The CI system never needs credentials for the cluster"
    D: "Network policies are generated and applied automatically"
  answer: C
  explanation: >
    With pull-based delivery the in-cluster agent (Argo CD, Flux) fetches the desired state
    and applies it with its own in-cluster permissions. The CI system needs only write
    access to Git or the registry, not admin credentials for the cluster.
  references:
    - https://opengitops.dev/
    - https://fluxcd.io/flux/concepts/

- id: kcna-ad-021
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: In Helm, what is a release?
  options:
    A: "A packaged collection of templates published to a repository"
    B: "A file of default configuration values shipped in a chart"
    C: "An instance of a chart running in a Kubernetes cluster"
    D: "A server-side Helm component that installs charts for you"
  answer: C
  explanation: >
    A chart is a Helm package, its values.yaml supplies configuration, and a release is one
    installed instance of a chart in a cluster. Installing the same chart twice creates two
    releases. Helm 3 has no server-side component.
  references:
    - https://helm.sh/docs/intro/introduction/

- id: kcna-ad-022
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: >
    You want to install a Helm chart with the settings from your own file,
    prod-values.yaml. Which flag passes that file?
  options:
    A: "--config prod-values.yaml"
    B: "--set-file prod-values.yaml"
    C: "--template prod-values.yaml"
    D: "-f prod-values.yaml"
  answer: D
  explanation: >
    -f (or --values) passes a YAML file of overrides, and when several are given the
    rightmost file wins. --set overrides single values on the command line and takes
    precedence over --values. --config and --template are not install options for values,
    and --set-file sets one value from a file's contents.
  references:
    - https://helm.sh/docs/intro/using_helm/

- id: kcna-ad-023
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: Which command watches a Deployment's rollout and reports when it has finished?
  options:
    A: "kubectl rollout status deployment/web"
    B: "kubectl get deployment/web --rollout"
    C: "kubectl describe rollout deployment/web"
    D: "kubectl wait deployment/web --rollout"
  answer: A
  explanation: >
    kubectl rollout status follows a Deployment rollout until it completes, or reports that
    it is stuck. The other flags and the rollout resource used in the distractors do not
    exist.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-ad-024
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    According to the CNCF glossary, how does continuous deployment differ from
    continuous delivery?
  options:
    A: "Continuous deployment only builds artifacts and never runs any tests"
    B: "Continuous deployment ships finished changes straight to production"
    C: "Continuous deployment applies to infrastructure, not applications"
    D: "Continuous deployment is a different name for the same practice"
  answer: B
  explanation: >
    Continuous delivery automatically deploys tested changes into an acceptance
    environment, so a release to production can happen at any time. Continuous deployment
    goes a step further and deploys finished software directly to production. Both rely on
    testing and on continuous integration first.
  references:
    - https://glossary.cncf.io/continuous-delivery/
    - https://glossary.cncf.io/continuous-deployment/

- id: kcna-ad-026
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    A team wants canary releases that shift traffic gradually, check metrics at each step
    and roll back automatically. Which tool adds this progressive delivery to Kubernetes?
  options:
    A: "Argo Rollouts"
    B: "Kustomize"
    C: "kubeadm"
    D: "Helm"
  answer: A
  explanation: >
    Argo Rollouts is a controller with CRDs that adds blue-green, canary and analysis-driven
    progressive delivery. It can shift traffic through ingress controllers or service
    meshes and roll back automatically based on metrics. A plain Deployment rolling update
    cannot do this, nor can Kustomize or Helm, which only render manifests.
  references:
    - https://argoproj.github.io/argo-rollouts/

- id: kcna-ad-027
  domain: app-delivery
  topic: application-delivery
  difficulty: hard
  question: >
    A cluster is managed by a GitOps agent that follows the OpenGitOps principles, with
    automatic reconciliation enabled. An engineer runs kubectl edit to change a
    Deployment's replica count directly in the cluster. What happens next?
  options:
    A: "The agent writes the new replica count back to Git as a commit"
    B: "The manual change becomes the new desired state from now on"
    C: "The agent stops syncing that Deployment until Git is updated"
    D: "The agent sees the drift from Git and restores the Git state"
  answer: D
  explanation: >
    Under the OpenGitOps principles, the desired state lives in a versioned source such as
    Git, and agents continuously observe the actual state and reconcile it towards that
    desired state. A manual change counts as drift and is reverted. To make it stick,
    change it in Git.
  references:
    - https://opengitops.dev/

- id: kcna-ad-031
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    You run kubectl set image deployment/web app=app:2.0 on a Deployment that uses the
    default RollingUpdate strategy. What does the Deployment controller do?
  options:
    A: "Restarts the containers of the existing Pods in place with the new image"
    B: "Deletes the Deployment and recreates it from the updated template"
    C: "Creates a new ReplicaSet and scales it up as it scales the old one down"
    D: "Edits the current ReplicaSet so new Pods use app:2.0 and old ones remain"
  answer: C
  explanation: >
    Changing the Pod template starts a rollout. The Deployment creates a new ReplicaSet
    for the new template and gradually scales it up while scaling the old ReplicaSet down,
    within maxSurge and maxUnavailable. The old ReplicaSet is kept (scaled to zero) so
    you can roll back. Pods are replaced, not patched in place.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment

- id: kcna-ad-033
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: Which command lists the revisions of the Deployment web so you can pick one to roll back to?
  options:
    A: "kubectl get revisions deployment/web"
    B: "kubectl describe rollout web"
    C: "kubectl logs deployment/web --revisions"
    D: "kubectl rollout history deployment/web"
  answer: D
  explanation: >
    kubectl rollout history lists a Deployment's revisions (add --revision=N for the
    details of one). kubectl rollout undo --to-revision=N then goes back to it. There is
    no revisions resource or rollout object to describe, and kubectl logs prints container
    output.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#checking-rollout-history-of-a-deployment

- id: kcna-ad-034
  domain: app-delivery
  topic: application-delivery
  difficulty: hard
  question: >
    A Deployment reads environment variables from a ConfigMap that you just updated. The
    image hasn't changed. Which command replaces the Pods so they pick up the new values?
  options:
    A: "kubectl rollout restart deployment/web"
    B: "kubectl rollout undo deployment/web"
    C: "kubectl set env deployment/web --reload"
    D: "kubectl apply --force deployment/web"
  answer: A
  explanation: >
    Environment variables are read only when a container starts. kubectl rollout restart
    adds a restart annotation to the Pod template, which triggers a normal rolling update
    with no change to the image. rollout undo goes back to an older revision, and the other
    two options are not valid kubectl usage for this.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_restart/
    - https://kubernetes.io/docs/concepts/configuration/configmap/

- id: kcna-ad-036
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: Which kubectl flag builds the kustomization in a directory and applies the result?
  options:
    A: "kubectl apply -f overlays/prod/kustomization.yaml"
    B: "kubectl apply -k overlays/prod"
    C: "kubectl kustomize apply overlays/prod"
    D: "kubectl apply --overlay overlays/prod"
  answer: B
  explanation: >
    Kustomize is built into kubectl. kubectl apply -k <dir> renders the kustomization.yaml
    in that directory and applies the output, and kubectl kustomize <dir> only prints the
    rendered YAML. kubectl has no --overlay flag and no "kustomize apply" subcommand.
  references:
    - https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/

- id: kcna-ad-041
  domain: app-delivery
  topic: application-delivery
  difficulty: easy
  question: What does Infrastructure as Code (IaC) mean?
  options:
    A: "Describing servers in a wiki page that operators follow step by step"
    B: "Writing application code that is designed to run only on bare metal"
    C: "Defining infrastructure in versioned files that tools apply automatically"
    D: "Building every infrastructure driver directly into the host's kernel"
  answer: C
  explanation: >
    IaC stores the definition of infrastructure in files, which replaces manual
    provisioning. Kept in version control, those files are a single source of truth that
    CI/CD pipelines can review and apply in an automated, repeatable way. Kubernetes
    manifests applied from Git follow the same idea.
  references:
    - https://glossary.cncf.io/infrastructure-as-code/

- id: kcna-ad-042
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    During a rolling update, new Pods need about 30 seconds to warm up after they start,
    and users see errors because traffic reaches them too early. What should the team add?
  options:
    A: "A liveness probe, so that slow Pods are restarted until they respond"
    B: "A readiness probe, so Pods get traffic only once they report ready"
    C: "The Recreate strategy, so old Pods stop before any new ones start"
    D: "More replicas, so that each new Pod receives a smaller share of traffic"
  answer: B
  explanation: >
    A readiness probe tells Kubernetes when a container can accept traffic. Until it
    passes, the Pod isn't added to its Services' endpoints, and the rolling update waits
    for new Pods to become available before removing more old ones - that is how rolling
    updates avoid downtime. A liveness probe would restart the slow Pods, Recreate causes
    downtime, and more replicas would still send some traffic to Pods that aren't ready.
  references:
    - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: kcna-ad-043
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    A pipeline pushes every build as app:latest. After a bad release, kubectl rollout undo
    does not bring the old code back. Which practice prevents this?
  options:
    A: "Set imagePullPolicy to Always so nodes fetch the image on every start"
    B: "Keep more old ReplicaSets so there are extra revisions to go back to"
    C: "Tag each build with a unique version or commit SHA, never reused"
    D: "Push the image to a second registry so an older copy is kept elsewhere"
  answer: C
  explanation: >
    A rollback restores the old Pod template, but if that template still says app:latest
    and the tag now points at the new build, the old code is gone. The Kubernetes docs
    advise avoiding :latest in production and using a meaningful tag such as v1.42.0
    and/or a digest, so each revision names exactly one image. Always pulling makes this
    worse, extra revisions still name the same tag, and a second registry doesn't change
    what the tag points to.
  references:
    - https://kubernetes.io/docs/concepts/containers/images/

- id: kcna-ad-044
  domain: app-delivery
  topic: application-delivery
  difficulty: medium
  question: >
    Why do delivery pipelines usually apply declarative manifests instead of running a
    sequence of imperative kubectl commands such as create and scale?
  options:
    A: "Manifests are applied faster because the API server skips validating them"
    B: "Manifests state the desired end state and can be versioned and re-applied"
    C: "Imperative commands are disabled on production clusters by default"
    D: "Manifests let the pipeline skip RBAC checks for the objects it changes"
  answer: B
  explanation: >
    A declarative manifest records the desired state of an object. Stored in Git, it can
    be reviewed, versioned and applied again and again with kubectl apply or a GitOps
    agent, with the same result each time. Imperative commands are one-off steps that
    leave no record of the intended state. The API server validates and authorizes every
    request either way, and imperative commands are not disabled.
  references:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/

# -------------------------------------------------------------------- debugging (13)

- id: kcna-ad-014
  domain: app-delivery
  topic: debugging
  difficulty: easy
  question: Which command opens an interactive shell inside the running Pod web-7d9f?
  options:
    A: kubectl attach web-7d9f --shell
    B: kubectl run web-7d9f -- sh
    C: kubectl ssh web-7d9f
    D: kubectl exec -it web-7d9f -- sh
  answer: D
  explanation: >
    kubectl exec runs a command in an existing container. -i keeps stdin open and -t
    allocates a TTY; everything after -- is the command. Add -c <container> for multi-container
    Pods.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-application/get-shell-running-container/

- id: kcna-ad-015
  domain: app-delivery
  topic: debugging
  difficulty: easy
  question: >
    You want to test a Pod's web endpoint from your laptop without creating a Service or
    an Ingress. Which command helps?
  options:
    A: kubectl expose pod web --port 8080
    B: kubectl port-forward pod/web 8080:80
    C: "kubectl proxy-pod web --local-port 8080"
    D: kubectl tunnel web 8080
  answer: B
  explanation: >
    kubectl port-forward forwards a local port (8080) to a port in the Pod (80) through the
    API server, which is handy for debugging. kubectl expose would create a Service.
  references:
    - https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/

- id: kcna-ad-016
  domain: app-delivery
  topic: debugging
  difficulty: hard
  question: >
    A Pod runs a distroless image that has no shell, so kubectl exec fails. How can you
    troubleshoot inside the Pod without changing its image?
  options:
    A: "Use kubectl debug to add an ephemeral debug container to the Pod"
    B: Edit the Pod spec to add a new regular container while it runs
    C: "Use kubectl cp to copy a static bash binary into the running container"
    D: "Restart the Pod with privileged set to true so exec gets a shell"
  answer: A
  explanation: >
    Ephemeral containers can be added to a running Pod (regular containers cannot).
    kubectl debug -it <pod> --image=busybox --target=<container> starts one, optionally
    sharing the target container's process namespace.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/

- id: kcna-ad-017
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    The Pod api has two containers, app and envoy. Which command shows the logs of the app
    container only?
  options:
    A: kubectl logs api/app
    B: kubectl logs api --all
    C: kubectl logs api -c app
    D: kubectl describe api app
  answer: C
  explanation: >
    For multi-container Pods, kubectl logs needs -c (or --container) to pick a container;
    --all-containers prints all of them.
  references:
    - https://kubernetes.io/docs/reference/kubectl/

- id: kcna-ad-018
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    A Helm chart install fails with a confusing manifest error. Which command renders the
    chart's templates locally so you can inspect the generated YAML?
  options:
    A: helm status
    B: helm template
    C: helm repo update
    D: helm lint --apply
  answer: B
  explanation: >
    helm template renders the chart with the supplied values and prints the resulting
    manifests without contacting the cluster. helm install --dry-run and helm lint are
    also useful.
  references:
    - https://helm.sh/docs/helm/helm_template/

- id: kcna-ad-019
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: Which command lists recent events in the current namespace, sorted by creation time?
  options:
    A: "kubectl logs --events --sort=creationTimestamp"
    B: "kubectl describe events --latest --namespace current"
    C: "kubectl top events --sort-by=.metadata.creationTimestamp"
    D: kubectl get events --sort-by=.metadata.creationTimestamp
  answer: D
  explanation: >
    Events are API objects recording state changes and errors (scheduling, pulls, probe
    failures). kubectl get events with --sort-by on a JSONPath field orders them; kubectl
    events is a newer alternative.
  references:
    - https://kubernetes.io/docs/reference/kubectl/

- id: kcna-ad-020
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    Before applying an edited manifest you want to see exactly what would change in the
    live object. Which command shows this?
  options:
    A: kubectl diff -f deployment.yaml
    B: kubectl compare -f deployment.yaml
    C: kubectl get -f deployment.yaml --changes
    D: kubectl apply -f deployment.yaml --show
  answer: A
  explanation: >
    kubectl diff shows the difference between the live object and what kubectl apply would
    produce. kubectl apply --dry-run=server is another way to validate changes without
    persisting them.
  references:
    - https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/

- id: kcna-ad-028
  domain: app-delivery
  topic: debugging
  difficulty: easy
  question: >
    Which command streams the logs of the Pod web-1 live, showing new lines as they are
    written?
  options:
    A: "kubectl logs -f web-1"
    B: "kubectl logs --watch-only web-1"
    C: "kubectl attach --logs web-1"
    D: "kubectl describe pod web-1 --follow"
  answer: A
  explanation: >
    kubectl logs -f (--follow) keeps the stream open and prints new log lines as they
    appear. The other flags do not exist, and kubectl attach connects to a running
    process's terminal rather than its logs.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/

- id: kcna-ad-038
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    Right after a release, a Pod's container starts, runs for a few seconds, exits with
    code 1, and is restarted with growing delays (CrashLoopBackOff). What is the most likely
    cause?
  options:
    A: "The application hits an error during startup and exits"
    B: "The image tag doesn't exist in the registry anymore"
    C: "No node has enough free CPU to schedule the Pod"
    D: "Its CPU limit is too low, so the kernel throttles it"
  answer: A
  explanation: >
    The container did start, so the image and scheduling are fine. A non-zero exit right
    after startup usually means the application failed, for example an unhandled exception,
    bad configuration or a missing dependency. A missing image gives ImagePullBackOff, no
    capacity leaves the Pod Pending, and hitting a CPU limit only slows the container. Check
    kubectl logs --previous and the exit code in kubectl describe.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-restarts
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-ad-040
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    To test cluster DNS, you want a throwaway Pod with an interactive shell that is deleted
    automatically when you exit. Which command does this?
  options:
    A: "kubectl exec -it tmp --image=busybox -- sh"
    B: "kubectl create pod tmp --image=busybox --shell"
    C: "kubectl attach tmp --image=busybox --rm"
    D: "kubectl run tmp -it --rm --image=busybox -- sh"
  answer: D
  explanation: >
    kubectl run creates a Pod. -it attaches an interactive terminal, --rm deletes the Pod
    after it exits, and -- sh sets the command. From that shell you can run nslookup
    against a Service name. kubectl exec and attach only work on Pods that already exist,
    and kubectl create has no pod subcommand.
  references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/
    - https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/

- id: kcna-ad-045
  domain: app-delivery
  topic: debugging
  difficulty: medium
  question: >
    kubectl get pods shows the Pod web-1 with STATUS Running but READY 0/1. What does
    this mean?
  options:
    A: "The container image is still being pulled onto the node"
    B: "The scheduler has not assigned the Pod to a node yet"
    C: "The container runs but has not passed its readiness check"
    D: "The container has exited and is waiting to be restarted"
  answer: C
  explanation: >
    Running means the Pod is bound to a node and its container has started. READY 0/1
    means the container isn't ready yet - usually its readiness (or startup) probe hasn't
    passed - so the Pod gets no Service traffic. A Pod that is pulling images or waiting
    for a node isn't Running yet, and an exited container shows a status such as Error or
    CrashLoopBackOff. kubectl describe pod lists the probe failures in its events.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
    - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/

- id: kcna-ad-046
  domain: app-delivery
  topic: debugging
  difficulty: hard
  question: >
    A container is restarted about once a minute, but its logs show no errors. kubectl
    describe pod lists the event "Liveness probe failed: HTTP probe failed with
    statuscode: 404". What is the most likely cause?
  options:
    A: "The node is out of memory, so the kubelet evicts the Pod"
    B: "The image tag changed, so the kubelet keeps pulling it again"
    C: "The liveness probe checks a path that the app doesn't serve"
    D: "A failing readiness probe keeps removing it from its Service"
  answer: C
  explanation: >
    The kubelet restarts a container when its liveness probe keeps failing. A 404 means
    the app is up and answering, just not on the probed path, so the probe's httpGet path
    (or port) is probably wrong. Fix the probe, not the app. Eviction removes the Pod
    rather than restarting a container, a tag change doesn't cause restarts, and readiness
    failures stop traffic without restarting anything.
  references:
    - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

- id: kcna-ad-047
  domain: app-delivery
  topic: debugging
  difficulty: easy
  question: >
    You want to see the full live definition of the Pod web-1 as stored by the API
    server, including its status fields. Which command shows this?
  options:
    A: "kubectl describe pod web-1 --raw"
    B: "kubectl logs web-1 --spec"
    C: "kubectl explain pod web-1"
    D: "kubectl get pod web-1 -o yaml"
  answer: D
  explanation: >
    kubectl get with -o yaml (or -o json) prints the complete object - metadata, spec and
    status - as the API server returns it, which is useful for checking what was actually
    applied. kubectl describe gives a readable summary with events, kubectl explain
    documents a resource type's schema, and kubectl logs prints container output.
  references:
    - https://kubernetes.io/docs/reference/kubectl/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
