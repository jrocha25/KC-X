# KCNA — Container Orchestration (28%) — 85 questions
# Topics: networking 25 · security 24 · troubleshooting 16 · storage 20
# Original questions. Not taken from any real exam. See docs/QUESTION_FORMAT.md.

# ------------------------------------------------------------------- networking (25)

- id: kcna-co-001
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: Which statement describes the Kubernetes networking model?
  options:
    A: "Pods on different nodes must go through NAT to reach each other"
    B: "Every Pod gets its own IP and can reach all other Pods without NAT"
    C: All Pods on a node share the node's IP address and are told apart by port
    D: "Pods can only talk to other Pods in the same namespace by default"
  answer: B
  explanation: >
    Kubernetes requires every Pod to have a unique cluster-wide IP and all Pods to be able
    to reach each other directly without NAT. Containers inside one Pod share that IP and
    communicate over localhost. A network plugin implements this model.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/

- id: kcna-co-002
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: Calico, Cilium and Flannel are examples of plugins that implement which interface?
  options:
    A: Container Runtime Interface (CRI)
    B: Container Storage Interface (CSI)
    C: Container Network Interface (CNI)
    D: Open Container Initiative (OCI) image spec
  answer: C
  explanation: >
    The CNI specification defines how network plugins configure Pod network interfaces and
    IP addresses. Kubernetes relies on a CNI plugin to implement the Pod network.
  references:
    - https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/

- id: kcna-co-003
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: If you create a Service without specifying spec.type, which type does it get?
  options:
    A: ClusterIP
    B: NodePort
    C: LoadBalancer
    D: ExternalName
  answer: A
  explanation: >
    ClusterIP is the default. It gives the Service a stable virtual IP that is reachable
    only from inside the cluster and load-balances across the matching Pods.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-004
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: What does a Service of type NodePort do?
  options:
    A: "Pins all of the Service's Pods to one node and exposes that node's IP"
    B: "Asks the cloud provider to create an external load balancer with a public IP"
    C: "Maps the Service to an external DNS name using a CNAME record"
    D: "Opens a static port (30000–32767 by default) on every node for the Service"
  answer: D
  explanation: >
    A NodePort Service allocates a port from the node port range and makes the Service
    reachable at <any-node-IP>:<nodePort>. It also gets a ClusterIP. LoadBalancer
    Services build on NodePort.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-005
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    On a managed cloud cluster you want a Service to receive an external IP from the cloud
    provider's load balancer. Which Service type should you use?
  options:
    A: ClusterIP
    B: LoadBalancer
    C: Headless
    D: ExternalName
  answer: B
  explanation: >
    type LoadBalancer asks the cloud provider integration (cloud-controller-manager or a
    load balancer controller) to provision an external load balancer that forwards traffic
    to the Service.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-006
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A Service named api lives in the namespace shop, and the cluster domain is
    cluster.local. What is the fully qualified DNS name of the Service?
  options:
    A: shop.api.cluster.local
    B: api.cluster.local
    C: api.shop.svc.cluster.local
    D: api.shop.pod.cluster.local
  answer: C
  explanation: >
    Services get DNS records of the form <service>.<namespace>.svc.<cluster-domain>. From
    within the same namespace the short name api also resolves.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/

- id: kcna-co-007
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: What is the role of kube-proxy on each node?
  options:
    A: "It programs rules (iptables or nftables) that route Service IPs to Pods"
    B: "It allocates an IP address to each new Pod from the node's Pod CIDR range"
    C: "It proxies kubectl and client requests from users through to the kube-apiserver"
    D: "It terminates TLS and routes HTTP traffic for Ingress resources"
  answer: A
  explanation: >
    kube-proxy watches Services and EndpointSlices and maintains rules on each node that
    implement Service virtual IPs. Pod IP allocation is the job of the CNI plugin; Ingress
    TLS is handled by an ingress controller.
  references:
    - https://kubernetes.io/docs/reference/networking/virtual-ips/

- id: kcna-co-008
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    You create an Ingress resource that routes /shop to one Service and /blog to another,
    but nothing happens — no traffic is routed. What is the most likely missing piece?
  options:
    A: "A separate NodePort Service for each of the two paths"
    B: A NetworkPolicy allowing ingress traffic
    C: "An Ingress controller running in the cluster"
    D: "A CNI plugin that supports HTTP-level routing"
  answer: C
  explanation: >
    An Ingress object is only a set of HTTP routing rules. An Ingress controller must be
    running to watch those objects and actually configure a proxy. Kubernetes does not
    ship one by default.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/ingress/
    - https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/

- id: kcna-co-009
  domain: container-orchestration
  topic: networking
  difficulty: hard
  question: >
    Which statement about the Gateway API is accurate?
  options:
    A: "A service mesh API that replaces kube-proxy for all east-west Service traffic"
    B: "A role-oriented API (GatewayClass, Gateway, HTTPRoute) designed to succeed Ingress"
    C: "A CNCF project that replaces CoreDNS with gateway-based service discovery"
    D: "An API the kubelet uses to pull container images through a registry gateway"
  answer: B
  explanation: >
    The Gateway API is an official Kubernetes (SIG Network) API. It separates roles —
    infrastructure providers define GatewayClasses, cluster operators define Gateways and
    application developers attach Routes — and supports richer routing than Ingress.
    The Kubernetes project now recommends Gateway over Ingress, whose API is frozen.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/gateway/
    - https://kubernetes.io/docs/concepts/services-networking/ingress/
    - https://gateway-api.sigs.k8s.io/

- id: kcna-co-010
  domain: container-orchestration
  topic: networking
  difficulty: hard
  question: >
    A Service is defined with clusterIP set to None. What does a DNS lookup of the Service
    name return?
  options:
    A: "An NXDOMAIN error, because the Service has no cluster IP at all"
    B: The IP of the node running kube-proxy
    C: A single virtual IP chosen at random
    D: The IP addresses of the ready Pods backing the Service
  answer: D
  explanation: >
    clusterIP None creates a headless Service. No virtual IP is allocated and kube-proxy
    does not handle it; DNS returns A/AAAA records for the backing Pods. StatefulSets use
    headless Services to give each Pod a stable DNS name.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-035
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    Which DNS server is the default implementation of cluster DNS in current Kubernetes,
    and is itself a CNCF project?
  options:
    A: "BIND"
    B: "dnsmasq"
    C: "Unbound"
    D: "CoreDNS"
  answer: D
  explanation: >
    CoreDNS is a flexible, extensible DNS server and the default implementation of
    Kubernetes cluster DNS. kubeadm installs it, and like Kubernetes it is hosted by the
    CNCF. The other three are general-purpose DNS servers.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/coredns/

- id: kcna-co-036
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    For a Service that has a selector, what do the EndpointSlices created by the control
    plane contain?
  options:
    A: "The firewall rules kube-proxy applies to the Service"
    B: "The network endpoints, typically Pod IPs, that back the Service"
    C: "The DNS records that CoreDNS serves for the Service's name"
    D: "The TLS certificates that the Service presents to each of its clients"
  answer: B
  explanation: >
    EndpointSlices track the IP addresses of a Service's backend endpoints. The control
    plane creates them automatically for every Service with a selector, listing the
    matching Pods, by default with up to 100 endpoints per slice. kube-proxy and DNS read
    them, but they hold no firewall rules or certificates.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/

- id: kcna-co-037
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A Service of type ExternalName in the namespace prod sets externalName to
    db.example.com. What does a Pod get when it looks up the Service's name?
  options:
    A: "A CNAME record that points to db.example.com"
    B: "A cluster IP that kube-proxy forwards to db.example.com"
    C: "The IP addresses of Pods labeled name=db.example.com"
    D: "An NXDOMAIN error, as the Service has no selector"
  answer: A
  explanation: >
    An ExternalName Service maps a Service name to an external DNS name. Cluster DNS answers
    with a CNAME record, so redirection happens at the DNS level and there is no cluster IP,
    proxying or selector involved.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-038
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A Service port entry sets port to 80 and does not set targetPort. Which port on the
    Pods receives the traffic?
  options:
    A: "Port 8080, the conventional default for application containers"
    B: "A random port that kube-proxy assigns from the NodePort range"
    C: "Port 80, because targetPort defaults to the value of port"
    D: "The first containerPort that is declared in the Pod spec"
  answer: C
  explanation: >
    A Service can map any incoming port to a targetPort, and for convenience targetPort
    defaults to the same value as port. targetPort can also refer to a named container
    port. NodePort allocation only applies to NodePort and LoadBalancer Services.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-052
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    A Pod in the namespace shop needs to call the Service api, which is also in shop. With
    default DNS settings, which is the shortest name that resolves?
  options:
    A: api.svc
    B: shop.api
    C: api.cluster
    D: api
  answer: D
  explanation: >
    A Pod's DNS search list includes its own namespace (shop.svc.cluster.local), then
    svc.cluster.local and cluster.local, so the bare name api expands to
    api.shop.svc.cluster.local. To reach a Service in another namespace you need at least
    <service>.<namespace>, for example api.shop.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/

- id: kcna-co-056
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    In the Gateway API, which resource does an application team create to define path-based
    HTTP routing rules that attach to an existing Gateway?
  options:
    A: GatewayClass
    B: Gateway
    C: Ingress
    D: HTTPRoute
  answer: D
  explanation: >
    The Gateway API splits roles. Infrastructure providers define a GatewayClass, cluster
    operators deploy a Gateway (listeners, addresses), and application developers attach
    HTTPRoutes that match paths or headers and forward to backend Services. Ingress is the
    older, separate API.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/gateway/

- id: kcna-co-069
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    The Pods of a web application are replaced on every rollout and get new IP addresses
    each time. What gives clients a stable address to reach them?
  options:
    A: "A Service, which keeps a stable virtual IP and DNS name"
    B: "A ConfigMap that lists the current Pod IPs for clients"
    C: "A static IP that is set in each container's environment"
    D: "The node's hostname, since Pods keep the node's address"
  answer: A
  explanation: >
    Pods are ephemeral, and each new Pod gets a new IP address. A Service gives a set of
    Pods, chosen by a label selector, one stable virtual IP and DNS name, and keeps its
    list of endpoints up to date as Pods come and go. Clients never need to track Pod IPs.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-070
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A team exposes an API with a ClusterIP Service and then tries to call it from a laptop
    outside the cluster, without success. What is the reason?
  options:
    A: "ClusterIP Services only accept traffic over the UDP protocol"
    B: "A ClusterIP is reachable only from inside the cluster by default"
    C: "ClusterIP Services need a NetworkPolicy before they accept traffic"
    D: "The Service gets its ClusterIP only after the first Pod restart"
  answer: B
  explanation: >
    ClusterIP, the default Service type, exposes the Service on an internal IP that is
    reachable only from within the cluster. To reach it from outside, use a NodePort or
    LoadBalancer Service, an Ingress or a Gateway (or kubectl port-forward for testing).
    ClusterIP Services carry TCP and UDP, need no NetworkPolicy, and get their IP when
    they are created.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/

- id: kcna-co-071
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A company runs 20 HTTP web applications in one cluster and wants a single external
    entry point that routes requests by host name and path. Which approach fits best?
  options:
    A: "One NodePort Service per app, all opened on the same node port"
    B: "A LoadBalancer Service for each app, each with its own public IP"
    C: "ExternalName Services that map each host name to its own Pods"
    D: "An Ingress or Gateway API controller with routing rules per app"
  answer: D
  explanation: >
    Ingress and the Gateway API route HTTP traffic by host and path from one entry point to
    many Services, so a single load balancer can serve all 20 apps. A LoadBalancer Service
    per app works but needs 20 external load balancers. Two Services can't share one node
    port, and ExternalName only returns a DNS CNAME for an external name.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/ingress/
    - https://kubernetes.io/docs/concepts/services-networking/gateway/

- id: kcna-co-072
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: >
    The Service web selects three ready Pods. A client Pod sends many requests to the
    Service's ClusterIP. How are those requests handled?
  options:
    A: "They are spread across the three ready Pods"
    B: "They all go to the oldest Pod until it fails"
    C: "They are sent to every Pod at once, as a broadcast"
    D: "They go to the kube-apiserver, which forwards each one"
  answer: A
  explanation: >
    A Service load-balances traffic for its virtual IP across the ready endpoints that
    match its selector. kube-proxy (or a network plugin that replaces it) programs each
    node so that every new connection goes to one of the backend Pods. There is no
    broadcast, and Service traffic does not pass through the API server.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/
    - https://kubernetes.io/docs/reference/networking/virtual-ips/

- id: kcna-co-082
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: By default, how does a Service of type LoadBalancer relate to the other Service types?
  options:
    A: "It also gets a ClusterIP and node ports that the cloud LB uses"
    B: "It replaces kube-proxy, so the LB sends traffic straight to Pods"
    C: "It only works with a headless Service that has no ClusterIP"
    D: "It needs an Ingress controller to create its external IP"
  answer: A
  explanation: >
    A LoadBalancer Service builds on the other types. Kubernetes first sets it up like a
    NodePort Service (which also has a ClusterIP), and then the cloud-controller-manager
    configures an external load balancer that forwards to it. kube-proxy still runs, and
    no Ingress controller is involved.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer

- id: kcna-co-083
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    In the role-oriented design of the Gateway API, who typically manages the
    GatewayClass, the Gateway and the HTTPRoute, in that order?
  options:
    A: "App developer; cluster operator; infrastructure provider"
    B: "Infrastructure provider; cluster operator; app developer"
    C: "Cluster operator; app developer; infrastructure provider"
    D: "Infrastructure provider; app developer; cluster operator"
  answer: B
  explanation: >
    The infrastructure provider (for example a cloud provider) offers a GatewayClass. A
    cluster operator creates a Gateway from it, and application developers attach
    HTTPRoutes to that Gateway to route traffic to their Services. Splitting the resources
    this way lets each role manage only its own part.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/gateway/
    - https://gateway-api.sigs.k8s.io/

- id: kcna-co-084
  domain: container-orchestration
  topic: networking
  difficulty: hard
  question: >
    A StatefulSet named db in the namespace data uses the headless Service db-svc. The
    cluster domain is cluster.local. Which DNS name resolves to its first Pod?
  options:
    A: "db.db-svc-0.data.svc.cluster.local"
    B: "db-svc-0.data.svc.cluster.local"
    C: "db-0.db-svc.data.svc.cluster.local"
    D: "db-0.data.pod.cluster.local"
  answer: C
  explanation: >
    StatefulSet Pods are named <statefulset>-<ordinal>, so the first one is db-0. Each Pod
    gets the DNS name <pod>.<governing service>.<namespace>.svc.<cluster domain>, where
    the governing Service is the headless Service named in serviceName.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#stable-network-id

- id: kcna-co-085
  domain: container-orchestration
  topic: networking
  difficulty: medium
  question: >
    A legacy application needs all requests from the same client IP to reach the same
    backend Pod. Which Service setting provides this?
  options:
    A: "spec.externalTrafficPolicy: Local"
    B: "spec.internalTrafficPolicy: Local"
    C: "spec.publishNotReadyAddresses: true"
    D: "spec.sessionAffinity: ClientIP"
  answer: D
  explanation: >
    Setting sessionAffinity to ClientIP (the default is None) sends connections from a
    given client IP to the same Pod. The traffic policies only control whether traffic
    stays on the local node, and publishNotReadyAddresses includes Pods that are not ready.
  references:
    - https://kubernetes.io/docs/reference/networking/virtual-ips/#session-affinity

- id: kcna-co-086
  domain: container-orchestration
  topic: networking
  difficulty: easy
  question: By default, from which port range does Kubernetes allocate the port of a NodePort Service?
  options:
    A: "1-1023"
    B: "8000-8999"
    C: "30000-32767"
    D: "49152-65535"
  answer: C
  explanation: >
    The control plane allocates node ports from the range set by the API server's
    --service-node-port-range flag, which defaults to 30000-32767. 1-1023 are the
    privileged well-known ports, and 49152-65535 is the usual ephemeral client range.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport

# --------------------------------------------------------------------- security (24)

- id: kcna-co-011
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: >
    In Kubernetes RBAC, which pair of objects grants a user permissions inside a single
    namespace?
  options:
    A: Role and RoleBinding
    B: ClusterRole and ClusterRoleBinding
    C: ServiceAccount and Secret
    D: NetworkPolicy and Namespace
  answer: A
  explanation: >
    A Role defines a set of permissions within a namespace, and a RoleBinding grants that
    Role to users, groups or ServiceAccounts in the same namespace.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- id: kcna-co-012
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: Which statement about ClusterRoles is correct?
  options:
    A: "It can only be granted through a ClusterRoleBinding, never a RoleBinding"
    B: "It can only grant read-only permissions such as get, list and watch on any resource"
    C: "It can grant cluster-scoped access and be reused per namespace by a RoleBinding"
    D: "It is reserved for control plane components and cannot be bound to users"
  answer: C
  explanation: >
    ClusterRoles are not namespaced. They are needed for cluster-scoped resources and
    non-resource URLs. A RoleBinding can reference a ClusterRole to grant its permissions
    only within the RoleBinding's namespace.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- id: kcna-co-013
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: What provides an identity for processes running inside a Pod when they call the Kubernetes API?
  options:
    A: A User object
    B: A ServiceAccount
    C: A kubeconfig file baked into the image
    D: The node's hostname
  answer: B
  explanation: >
    ServiceAccounts are namespaced identities for workloads. Pods get a short-lived,
    automatically rotated token for their ServiceAccount, which RBAC can grant permissions
    to. Kubernetes has no User objects; users come from external authentication.
  references:
    - https://kubernetes.io/docs/concepts/security/service-accounts/

- id: kcna-co-014
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: By default, how are the values of a Kubernetes Secret stored in etcd?
  options:
    A: "Encrypted with AES-256 using a per-node key that the kubelet manages and rotates"
    B: "Hashed with SHA-256 so that the original values can never be read back"
    C: "Stored in a separate built-in secure vault outside of etcd"
    D: "Unencrypted unless encryption at rest is configured; base64 is merely an encoding"
  answer: D
  explanation: >
    Secret data is base64-encoded in manifests, which is not encryption. Unless the API
    server is configured with an EncryptionConfiguration (e.g. a KMS provider), Secrets
    are stored unencrypted in etcd. Restricting RBAC access to Secrets matters too.
  references:
    - https://kubernetes.io/docs/concepts/configuration/secret/
    - https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/

- id: kcna-co-015
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    You apply a NetworkPolicy to deny traffic to the database Pods, but connections are
    still allowed. What is a likely reason?
  options:
    A: The cluster's network plugin does not enforce NetworkPolicy
    B: NetworkPolicies only apply to Services, not Pods
    C: NetworkPolicies only take effect after the node is rebooted
    D: NetworkPolicies require a service mesh to work
  answer: A
  explanation: >
    NetworkPolicy objects are enforced by the network plugin. If the CNI plugin in use
    does not support them (for example basic Flannel), the objects are accepted by the API
    server but have no effect.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/

- id: kcna-co-016
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: In a namespace where no NetworkPolicy selects a given Pod, what traffic is allowed to and from that Pod?
  options:
    A: Only traffic from Pods in the same namespace
    B: No traffic at all until a policy is created
    C: All ingress and egress traffic
    D: Only traffic to and from the API server
  answer: C
  explanation: >
    Pods are non-isolated by default and accept traffic from any source. A Pod becomes
    isolated for ingress or egress only once a NetworkPolicy selecting it includes that
    policy type. A common pattern is to add a default-deny policy per namespace.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/

- id: kcna-co-017
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: Which three policy levels are defined by the Pod Security Standards and enforced by Pod Security Admission?
  options:
    A: Low, Medium, High
    B: Privileged, Baseline, Restricted
    C: Open, Default, Locked
    D: "Permissive, Enforcing, Restricted"
  answer: B
  explanation: >
    Privileged is unrestricted, Baseline prevents known privilege escalations, and
    Restricted follows current hardening best practices. Pod Security Admission applies a
    level per namespace (via labels) in enforce, audit or warn mode. It replaced the removed
    PodSecurityPolicy.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/

- id: kcna-co-018
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    Which part of a Pod or container spec do you use to require that the container does
    not run as root and has a read-only root filesystem?
  options:
    A: resources
    B: env
    C: volumeMounts
    D: securityContext
  answer: D
  explanation: >
    securityContext holds privilege and access-control settings such as runAsNonRoot,
    runAsUser, readOnlyRootFilesystem, allowPrivilegeEscalation and capabilities.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/

- id: kcna-co-019
  domain: container-orchestration
  topic: security
  difficulty: hard
  question: In which order does the kube-apiserver process an incoming request that creates an object?
  options:
    A: Authorization, authentication, admission control
    B: Admission control, authentication, authorization
    C: Authentication, authorization, admission control
    D: Authentication, admission control, authorization
  answer: C
  explanation: >
    The API server first authenticates the caller (who are you?), then authorizes the
    action, for example via RBAC (are you allowed?), then runs admission controllers
    (mutating, then validating), which can modify or reject the object before it is
    persisted.
  references:
    - https://kubernetes.io/docs/concepts/security/controlling-access/

- id: kcna-co-040
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    Which namespace label makes Pod Security Admission reject Pods that violate the
    restricted profile, instead of only warning about them?
  options:
    A: "pod-security.kubernetes.io/warn: restricted"
    B: "pod-security.kubernetes.io/audit: restricted"
    C: "pod-security.kubernetes.io/level: restricted"
    D: "pod-security.kubernetes.io/enforce: restricted"
  answer: D
  explanation: >
    Pod Security Admission is configured with namespace labels of the form
    pod-security.kubernetes.io/<MODE>: <LEVEL>. In enforce mode violating Pods are rejected,
    in audit mode they are recorded in the audit log, and in warn mode the user gets a
    warning. There is no level mode.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/

- id: kcna-co-041
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    A user is bound to a ClusterRole that allows reading Secrets everywhere. How can you add
    an RBAC rule that denies them access to Secrets in the namespace payments?
  options:
    A: "Create a Role in payments that sets verbs to deny"
    B: "Create a RoleBinding in payments with a higher priority"
    C: "You can't: RBAC rules are purely additive, with no deny rules"
    D: "Add the user to an exclusions list on the existing ClusterRoleBinding"
  answer: C
  explanation: >
    RBAC permissions are purely additive; there are no deny rules, priorities or
    exclusions. To restrict the user you must remove or narrow the binding that grants the
    access, for example by replacing the ClusterRoleBinding with RoleBindings in the
    namespaces they need.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- id: kcna-co-043
  domain: container-orchestration
  topic: security
  difficulty: hard
  question: How are normal (human) user accounts managed in Kubernetes?
  options:
    A: "They are User objects created with kubectl create user"
    B: "They are ServiceAccounts in the kube-system namespace"
    C: "They are stored in etcd, each with its own hashed password"
    D: "There are no User objects; users authenticate by other means"
  answer: D
  explanation: >
    Kubernetes has no objects that represent normal users, and users cannot be added
    through an API call. Instead, a request is authenticated by methods such as a client
    certificate signed by the cluster CA or an OpenID Connect token, and RBAC then decides
    what that username may do. ServiceAccounts are for workloads.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/authentication/

- id: kcna-co-044
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: Which command creates a Secret named db-user-pass from literal key/value pairs?
  options:
    A: "kubectl apply secret db-user-pass --data=username=admin"
    B: "kubectl create secret generic db-user-pass --from-literal=username=admin"
    C: "kubectl create configmap db-user-pass --secret --from-literal=username=admin"
    D: "kubectl set secret db-user-pass --literal=username=admin"
  answer: B
  explanation: >
    kubectl create secret generic builds an Opaque Secret, and each --from-literal adds one
    key. kubectl apply works with manifests rather than subcommands, ConfigMaps have no
    --secret flag, and kubectl set has no secret subcommand.
  references:
    - https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/

- id: kcna-co-057
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: >
    You want Pod Security Admission to apply the restricted Pod Security Standard to every
    Pod in a group of workloads. Which object do you label?
  options:
    A: Pod
    B: ServiceAccount
    C: Namespace
    D: Node
  answer: C
  explanation: >
    Pod Security Admission is configured per namespace with labels of the form
    pod-security.kubernetes.io/<MODE>=<LEVEL>, for example
    pod-security.kubernetes.io/enforce=restricted. You don't need a separate policy object
    (PodSecurityPolicy was removed in v1.25), and labels on Pods, ServiceAccounts or Nodes
    have no effect.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/

- id: kcna-co-073
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    A CI job only needs to update Deployments in the namespace staging. Following the
    principle of least privilege, how should it get access?
  options:
    A: "A Role that allows updating Deployments in staging, bound with a RoleBinding"
    B: "A ClusterRoleBinding to cluster-admin, so the job never hits permission errors"
    C: "A copy of the cluster administrator's kubeconfig stored in the CI system"
    D: "A ClusterRole for all verbs on Deployments, bound with a ClusterRoleBinding"
  answer: A
  explanation: >
    Least privilege means granting only the permissions a task needs, in the narrowest
    scope. A namespaced Role that allows reading and updating Deployments in staging,
    granted to the job's ServiceAccount through a RoleBinding, does exactly that.
    cluster-admin, the administrator's own credentials and a cluster-wide binding all give
    far more access than the job needs.
  references:
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- id: kcna-co-074
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: What does an admission controller in the kube-apiserver do?
  options:
    A: "Checks a user's password before any API request is accepted"
    B: "Intercepts requests after authorization to check or change objects"
    C: "Schedules newly created Pods onto nodes that pass security checks"
    D: "Encrypts every object before the API server writes it into etcd"
  answer: B
  explanation: >
    An admission controller intercepts requests to the API server after they are
    authenticated and authorized, but before the object is stored. Mutating controllers
    can change the object (for example to add defaults), and validating controllers can
    reject it. Pod Security Admission and ResourceQuota work this way. Authentication,
    scheduling and encryption at rest are handled elsewhere.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- id: kcna-co-075
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: >
    A team wants to stop container images with known vulnerabilities from reaching the
    cluster. Which practice addresses this?
  options:
    A: "Raising CPU limits so that patched libraries load faster"
    B: "Deploying the images with the Recreate update strategy"
    C: "Scanning images for known CVEs in the CI/CD pipeline"
    D: "Storing image names in a Secret instead of a ConfigMap"
  answer: C
  explanation: >
    Image scanning checks the packages in an image against vulnerability databases. The
    Kubernetes security checklist recommends scanning images regularly, usually in the
    CI/CD pipeline before deployment, so that only patched images reach production.
    Resource limits, rollout strategies and where an image name is stored don't change
    what is inside the image.
  references:
    - https://kubernetes.io/docs/concepts/security/security-checklist/#images

- id: kcna-co-076
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    A team wants every Pod in the namespace payments to reject incoming traffic unless
    another policy explicitly allows it. What is the usual approach?
  options:
    A: "A default-deny NetworkPolicy that selects all Pods in payments"
    B: "Deleting the Services in payments so that no traffic can reach it"
    C: "The namespace label pod-security.kubernetes.io/enforce=restricted"
    D: "A securityContext with runAsNonRoot: true on every Pod in payments"
  answer: A
  explanation: >
    Pods accept all traffic until a NetworkPolicy selects them. A default-deny policy with
    an empty podSelector and the Ingress policy type isolates every Pod in the namespace,
    and further policies then allow only the traffic that is needed. Pods stay reachable
    by IP without Services, and Pod Security labels and securityContext control what a
    container may do, not network traffic. The network plugin must enforce NetworkPolicy.
  references:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
    - https://kubernetes.io/docs/concepts/security/security-checklist/

- id: kcna-co-077
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: >
    An application needs a database password at runtime. Where should the password be
    kept in Kubernetes?
  options:
    A: "In a ConfigMap that is mounted into the container as a file"
    B: "Hard-coded into the container image during the CI build"
    C: "In an annotation on the application's Deployment object"
    D: "In a Secret, consumed by the Pod as a file or variable"
  answer: D
  explanation: >
    Secrets hold confidential data such as passwords, tokens and keys, separately from Pod
    specs and images. Pods consume them as mounted files or environment variables, and
    access can be restricted with RBAC and protected with encryption at rest. ConfigMaps
    are for non-confidential settings, and a value baked into an image or an annotation is
    visible to anyone who can read those.
  references:
    - https://kubernetes.io/docs/concepts/configuration/secret/

- id: kcna-co-087
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    A ClusterRole named pod-reader allows reading Pods. You bind it to the user jane with a
    RoleBinding in the namespace dev. What can jane do?
  options:
    A: "Read Pods in every namespace of the cluster"
    B: "Read Pods only in the namespace dev"
    C: "Nothing, as a RoleBinding cannot use a ClusterRole"
    D: "Read Pods in dev and in kube-system"
  answer: B
  explanation: >
    A RoleBinding may reference a ClusterRole. The permissions are then granted only
    inside the RoleBinding's namespace. This lets you define common roles once and reuse
    them per namespace. A ClusterRoleBinding would grant them in every namespace.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#rolebinding-and-clusterrolebinding

- id: kcna-co-088
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    A Pod never calls the Kubernetes API. Which Pod setting stops Kubernetes from
    mounting a ServiceAccount token into it?
  options:
    A: "automountServiceAccountToken: false"
    B: "serviceAccountName: none"
    C: "securityContext.readOnlyRootFilesystem: true"
    D: "enableServiceLinks: false"
  answer: A
  explanation: >
    Setting automountServiceAccountToken to false in the Pod spec (or on the
    ServiceAccount) stops the API credentials from being injected, which reduces risk if
    the container is compromised. There is no ServiceAccount named none by default,
    readOnlyRootFilesystem affects the container's filesystem, and enableServiceLinks
    controls Service environment variables.
  references:
    - https://kubernetes.io/docs/concepts/security/service-accounts/
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/

- id: kcna-co-089
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: A Pod is created without spec.serviceAccountName. Which ServiceAccount does it use?
  options:
    A: "A new ServiceAccount created and named after the Pod"
    B: "The cluster-admin ServiceAccount in kube-system"
    C: "None; such a Pod has no identity for the API"
    D: "The ServiceAccount named default in its namespace"
  answer: D
  explanation: >
    Kubernetes creates a ServiceAccount named default in every namespace and assigns it to
    Pods that do not name one. By default it has no permissions beyond API discovery, so
    workloads that need access should get their own ServiceAccount with only the RBAC they
    need.
  references:
    - https://kubernetes.io/docs/concepts/security/service-accounts/#default-service-accounts

- id: kcna-co-090
  domain: container-orchestration
  topic: security
  difficulty: medium
  question: >
    Secrets are stored in etcd base64-encoded but not encrypted. Which built-in control
    protects them if someone copies the etcd data files?
  options:
    A: "Base64-encoding the values twice before creating the Secret"
    B: "Marking each Secret immutable so its data cannot be changed"
    C: "Turning on encryption at rest in the kube-apiserver"
    D: "Storing the values in a ConfigMap with a restricted label"
  answer: C
  explanation: >
    The kube-apiserver can encrypt Secret data before writing it to etcd, using an
    encryption configuration (for example with a KMS provider). Base64 is an encoding, not
    encryption, immutability only blocks changes, and ConfigMaps are meant for
    non-confidential data.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
    - https://kubernetes.io/docs/concepts/configuration/secret/

- id: kcna-co-091
  domain: container-orchestration
  topic: security
  difficulty: easy
  question: Why is running a container with securityContext.privileged set to true risky?
  options:
    A: "It publishes the container's image to a public registry"
    B: "It gives the container almost full access to the host"
    C: "It lets the container skip its CPU and memory limits"
    D: "It exposes every container port on the node's IP address"
  answer: B
  explanation: >
    A privileged container disables most isolation mechanisms. It gets access to the
    host's devices and nearly all kernel capabilities, so a compromise can easily spread to
    the node. The Baseline and Restricted Pod Security Standards forbid it. It has no
    effect on images, resource limits or ports.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/

# -------------------------------------------------------------- troubleshooting (16)

- id: kcna-co-020
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A Pod shows status CrashLoopBackOff. Which command is most useful for seeing why the
    previous container instance exited?
  options:
    A: kubectl logs <pod> --previous
    B: kubectl get nodes
    C: kubectl top pod <pod>
    D: kubectl rollout history deployment <name>
  answer: A
  explanation: >
    CrashLoopBackOff means the container keeps exiting and the kubelet is backing off
    restarts. kubectl logs --previous (-p) shows output from the last terminated instance;
    kubectl describe pod shows the exit code and events.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/

- id: kcna-co-021
  domain: container-orchestration
  topic: troubleshooting
  difficulty: easy
  question: A Pod is stuck with the status ImagePullBackOff. Which is the most likely cause?
  options:
    A: "The node is out of memory and the kubelet is evicting Pods"
    B: "The image name or tag is wrong, or registry credentials are missing"
    C: "The liveness probe keeps failing and the container restarts"
    D: "The Service selector does not match the labels set on the Pod template"
  answer: B
  explanation: >
    ImagePullBackOff means the kubelet could not pull the image and is backing off retries.
    Typical causes are typos in the image reference, a missing tag, or a private registry
    without imagePullSecrets.
  references:
    - https://kubernetes.io/docs/concepts/containers/images/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-co-022
  domain: container-orchestration
  topic: troubleshooting
  difficulty: easy
  question: Which command shows a Pod's detailed state together with its recent events, such as scheduling failures?
  options:
    A: kubectl get pod <pod> -o name
    B: kubectl logs <pod>
    C: kubectl exec <pod> -- env
    D: kubectl describe pod <pod>
  answer: D
  explanation: >
    kubectl describe aggregates an object's spec, status, conditions and related events —
    usually the first stop for Pending, image pull or probe problems. kubectl get events
    lists events too.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-co-023
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A container keeps restarting and kubectl describe shows "Last State: Terminated,
    Reason: OOMKilled, Exit Code: 137". What happened?
  options:
    A: "The container image is corrupted and the entrypoint cannot start"
    B: "The liveness probe timed out and the kubelet killed the container"
    C: "It exceeded its memory limit and was killed by the OOM killer"
    D: "The node ran out of disk space for the container's writable layer"
  answer: C
  explanation: >
    OOMKilled means the container used more memory than its limit (or the node was under
    memory pressure). Exit code 137 is 128 + 9 (SIGKILL). Raise the limit or fix the
    application's memory usage.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/

- id: kcna-co-024
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    Requests to a Service time out. kubectl get endpointslices shows no endpoints for it,
    although the Pods are Running and Ready. What should you check first?
  options:
    A: Whether the Service's selector matches the Pods' labels
    B: "Whether the nodes have enough free disk space for the Pods"
    C: Whether the container image uses the latest tag
    D: Whether etcd is running in the Pods' namespace
  answer: A
  explanation: >
    A Service only gets endpoints for ready Pods whose labels match its selector. A typo in
    the selector or labels is one of the most common reasons for an empty endpoint list.
    Also check that targetPort matches the container port.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/

- id: kcna-co-025
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    kubectl get nodes shows one worker as NotReady. Which component on that node should
    you investigate first?
  options:
    A: "The kube-scheduler on the control plane"
    B: "The kubelet service running on that node"
    C: "The etcd member storing that node's object"
    D: "The Ingress controller handling the node's traffic"
  answer: B
  explanation: >
    A node's Ready condition is reported by its kubelet. If the kubelet is stopped,
    misconfigured, cannot reach the API server, or the container runtime or CNI plugin is
    broken, the node goes NotReady.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-cluster/

- id: kcna-co-026
  domain: container-orchestration
  topic: troubleshooting
  difficulty: hard
  question: >
    A Pod's readiness probe starts failing while its liveness probe keeps passing. What
    does Kubernetes do?
  options:
    A: "Restarts the container immediately to recover the probe"
    B: Deletes the Pod and lets the ReplicaSet create a new one
    C: "Evicts the Pod so the scheduler can move it to a healthier node"
    D: "Stops sending it Service traffic but does not restart it"
  answer: D
  explanation: >
    Readiness controls whether a Pod receives traffic; liveness controls restarts. A failed
    readiness probe takes the Pod out of load balancing until it passes again. Only a
    failing liveness (or startup) probe causes the kubelet to restart the container.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

- id: kcna-co-045
  domain: container-orchestration
  topic: troubleshooting
  difficulty: easy
  question: >
    kubectl top pods fails with an error saying that the Metrics API is not available.
    What is most likely missing from the cluster?
  options:
    A: "metrics-server"
    B: "Prometheus"
    C: "CoreDNS"
    D: "kube-proxy"
  answer: A
  explanation: >
    kubectl top reads CPU and memory usage from the Metrics API, which is served by
    metrics-server (or another adapter for that API). Prometheus is a separate monitoring
    system, and CoreDNS and kube-proxy do not serve the Metrics API.
  references:
    - https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/

- id: kcna-co-046
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    Inside every Pod, nslookup of any Service name times out, even for
    kubernetes.default. What should you check first?
  options:
    A: "The kubelet logs on every node, for failed volume mounts"
    B: "The Ingress controller's logs in the ingress-nginx namespace"
    C: "That CoreDNS Pods (label k8s-app=kube-dns) run in kube-system"
    D: "The container image registry, for ImagePullBackOff errors"
  answer: C
  explanation: >
    When no Service name resolves anywhere, cluster DNS itself is the suspect. Check that
    the CoreDNS Pods are running with kubectl get pods -n kube-system -l k8s-app=kube-dns
    and read their logs. The label keeps the value kube-dns for backward compatibility.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/

- id: kcna-co-062
  domain: container-orchestration
  topic: troubleshooting
  difficulty: hard
  question: >
    Pods in the namespace payments log "temporary failure in name resolution" when calling
    other Services, while Pods in other namespaces work. What is the best first step?
  options:
    A: "Restart every CoreDNS Pod in kube-system to clear its cache"
    B: "Run nslookup for the Service name from a Pod in payments"
    C: "Check the kube-scheduler logs for DNS-related errors"
    D: "Delete and recreate the Services that are being called"
  answer: B
  explanation: >
    Test DNS from the client's point of view - exec into a failing Pod (or start a
    temporary Pod in that namespace) and run nslookup or dig, then check its
    /etc/resolv.conf. This shows whether the problem is in that namespace (for example a
    NetworkPolicy blocking port 53 or a wrong name) before you restart cluster-wide
    components. The scheduler has nothing to do with DNS.
  references:
    - https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/

- id: kcna-co-063
  domain: container-orchestration
  topic: troubleshooting
  difficulty: hard
  question: >
    The container runtime on node worker-1 crashes and does not come back. What is the
    main impact on that node?
  options:
    A: "Every running container on the node is stopped at the same moment"
    B: "kube-scheduler moves the node's Pods to other nodes within seconds"
    C: "Only image pulls fail, because the kubelet runs containers itself"
    D: "The kubelet can no longer start or manage containers on the node"
  answer: D
  explanation: >
    The kubelet needs a working container runtime to launch Pods and their containers. With
    the runtime down, new containers can't be started and the kubelet can't manage existing
    ones, so the node soon reports NotReady. Containers that are already running aren't
    killed by the outage itself. The scheduler never moves running Pods. Eviction from an
    unhealthy node is handled by the node controller after a grace period.
  references:
    - https://kubernetes.io/docs/concepts/architecture/cri/
    - https://kubernetes.io/docs/concepts/architecture/nodes/

- id: kcna-co-064
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A Pod stays Pending, and its events say "0/3 nodes are available: 3 node(s) had
    untolerated taint {dedicated: gpu}". What resolves this for the Pod?
  options:
    A: "Add a matching toleration to the Pod, or remove the taint"
    B: "Raise the Pod's CPU request so it gets higher priority"
    C: "Add the label dedicated=gpu to the Pod's metadata"
    D: "Restart the kubelet on each node to clear the taint"
  answer: A
  explanation: >
    A taint repels every Pod that doesn't tolerate it. The scheduler skips all three nodes
    because the Pod has no toleration for dedicated=gpu. Add a toleration (if the Pod
    belongs on those nodes) or remove the taint. Pod labels don't match taints, and
    restarting the kubelet doesn't remove taints.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

- id: kcna-co-078
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A new Pod stays Pending, and its events show "pod has unbound immediate
    PersistentVolumeClaims". What should you check?
  options:
    A: "Whether the container image exists in the registry"
    B: "Whether its PVC can bind to a PV or a StorageClass"
    C: "Whether the Pod's readiness probe path is correct"
    D: "Whether the Service selector matches the Pod labels"
  answer: B
  explanation: >
    The scheduler can't place a Pod whose PersistentVolumeClaim is still unbound. Run
    kubectl get pvc and kubectl describe pvc to see why - common causes are no matching
    PV, no default StorageClass, or a provisioner error. Image pulls and probes only matter
    after the Pod is scheduled, and Service selectors don't affect scheduling.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-co-092
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A Pod stays Pending with the event "0/4 nodes are available: 4 node(s) didn't match
    Pod's node affinity/selector". What is the most likely cause?
  options:
    A: "No node has the labels its node selector or affinity needs"
    B: "All four nodes carry a taint that the Pod does not tolerate"
    C: "The Pod requests more CPU than any node has available"
    D: "The PersistentVolumeClaim it uses has not been bound yet"
  answer: A
  explanation: >
    The message means that the Pod's nodeSelector or required node affinity matches the
    labels of none of the nodes. Fix the labels on the nodes or the rule in the Pod. Taints,
    insufficient CPU and unbound PVCs each produce their own, different scheduling messages.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: kcna-co-093
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    A new Pod shows the status CreateContainerConfigError, and kubectl describe reports
    that the ConfigMap app-config was not found. What should you do?
  options:
    A: "Increase the Pod's memory limit and redeploy it"
    B: "Pull the image again with imagePullPolicy set to Always"
    C: "Add a toleration so the Pod can run on another node"
    D: "Create the ConfigMap app-config in the Pod's namespace"
  answer: D
  explanation: >
    The kubelet cannot build the container's configuration because a required ConfigMap
    it references does not exist. The ConfigMap must exist in the same namespace as the
    Pod, unless the reference is marked optional. Memory, image pulls and tolerations are
    unrelated to this error.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
    - https://kubernetes.io/docs/concepts/configuration/configmap/

- id: kcna-co-094
  domain: container-orchestration
  topic: troubleshooting
  difficulty: medium
  question: >
    Several Pods on worker-2 show the status Evicted, and the node reports the condition
    DiskPressure. What happened?
  options:
    A: "The kubelet evicted Pods to reclaim disk space on the node"
    B: "The scheduler moved the Pods to balance disk usage"
    C: "The PVCs of the Pods were deleted by their reclaim policy"
    D: "The API server removed Pods that exceeded a ResourceQuota"
  answer: A
  explanation: >
    When free disk space or inodes on a node fall below an eviction threshold, the kubelet
    sets DiskPressure and proactively ends Pods to reclaim resources (node-pressure
    eviction). The scheduler never moves running Pods, and ResourceQuota is enforced when
    objects are created, not by evicting Pods.
  references:
    - https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/

# ----------------------------------------------------------------------- storage (20)

- id: kcna-co-027
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: What happens to the data in an emptyDir volume when its Pod is deleted?
  options:
    A: It is deleted permanently
    B: It is moved to a PersistentVolume
    C: It is kept on the node until the node reboots
    D: It is copied to the replacement Pod
  answer: A
  explanation: >
    An emptyDir is created when a Pod is assigned to a node and exists as long as that Pod
    runs there. It survives container restarts but is deleted when the Pod is removed.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/

- id: kcna-co-028
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: What is a PersistentVolumeClaim (PVC)?
  options:
    A: "A piece of storage in the cluster that an administrator provisioned"
    B: "A user's request for storage that is then bound to a PersistentVolume"
    C: "A point-in-time backup copy of a PersistentVolume"
    D: A plugin that connects Kubernetes to a storage vendor
  answer: B
  explanation: >
    A PersistentVolume (PV) is a piece of storage in the cluster; a PVC is a user's request
    for storage of a given size and access mode. Pods reference PVCs, which are bound to
    PVs.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

- id: kcna-co-029
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: Which object enables dynamic provisioning, so PersistentVolumes are created automatically when a PVC asks for them?
  options:
    A: VolumeSnapshot
    B: LimitRange
    C: StorageClass
    D: ConfigMap
  answer: C
  explanation: >
    A StorageClass names a provisioner (usually a CSI driver) and its parameters. When a
    PVC references a StorageClass (or the default one), the provisioner creates a matching
    PV on demand.
  references:
    - https://kubernetes.io/docs/concepts/storage/storage-classes/
    - https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/

- id: kcna-co-030
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: What does the ReadWriteOnce access mode on a PersistentVolume mean?
  options:
    A: The volume can be written only once and is read-only afterwards
    B: The volume can be mounted read-write by many nodes
    C: The volume can be mounted read-write by a single node
    D: The volume can be mounted by a single Pod, read-only
  answer: C
  explanation: >
    ReadWriteOnce (RWO) allows read-write mounting by a single node; several Pods on that
    node can still use it. ReadWriteMany (RWX) allows many nodes, and ReadWriteOncePod
    (RWOP) restricts it to a single Pod.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

- id: kcna-co-031
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: Which standard lets storage vendors write a single plugin that works with Kubernetes and other container orchestrators?
  options:
    A: Container Network Interface (CNI)
    B: Container Runtime Interface (CRI)
    C: Service Mesh Interface (SMI)
    D: Container Storage Interface (CSI)
  answer: D
  explanation: >
    CSI is a standard for exposing block and file storage to containerized workloads.
    Vendors ship CSI drivers out of tree instead of adding code to Kubernetes itself.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/
    - https://github.com/container-storage-interface/spec

- id: kcna-co-032
  domain: container-orchestration
  topic: storage
  difficulty: hard
  question: >
    A PersistentVolume was dynamically provisioned from a StorageClass that does not set
    reclaimPolicy. What happens to the volume when its PVC is deleted?
  options:
    A: The PV and its underlying storage are deleted
    B: The PV is retained and must be cleaned up manually
    C: The PV is recycled with rm -rf and made available again
    D: The PV is bound to the next PVC that requests the same size
  answer: A
  explanation: >
    Dynamically provisioned PVs inherit the StorageClass reclaim policy, which defaults to
    Delete. Set reclaimPolicy Retain on the StorageClass (or patch the PV) to keep the data.
    The Recycle policy is deprecated.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - https://kubernetes.io/docs/concepts/storage/storage-classes/

- id: kcna-co-033
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: >
    You want to provide an nginx.conf file to a container without rebuilding its image.
    Which object is designed for non-confidential configuration like this?
  options:
    A: Secret
    B: ConfigMap
    C: PersistentVolume
    D: CustomResourceDefinition
  answer: B
  explanation: >
    A ConfigMap stores non-confidential key/value configuration and can be consumed as
    environment variables or mounted as files in a volume. Use a Secret for confidential
    data.
  references:
    - https://kubernetes.io/docs/concepts/configuration/configmap/

- id: kcna-co-034
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    A PVC that does not set storageClassName stays Pending, and no PV is ever created. The
    cluster has a CSI driver installed. What is a likely cause?
  options:
    A: "The PVC was created in a namespace the CSI driver does not watch"
    B: "The node does not have enough free memory to mount the volume"
    C: "No StorageClass is marked as default and no existing PV matches the claim"
    D: "PVCs can only be bound when they are created by a StatefulSet"
  answer: C
  explanation: >
    A PVC without storageClassName uses the default StorageClass, if one exists. With no
    default class, the claim can only bind to a pre-provisioned PV that matches its size
    and access mode; otherwise it stays Pending.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/

- id: kcna-co-048
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: >
    A Secret with the keys username and password is mounted as a volume at /etc/creds.
    What does the container see?
  options:
    A: "A single YAML file /etc/creds/secret.yaml with both keys"
    B: "Two environment variables named USERNAME and PASSWORD"
    C: "An empty directory until the container calls the API server"
    D: "Two files, /etc/creds/username and /etc/creds/password"
  answer: D
  explanation: >
    When a Secret is mounted as a volume, each key becomes a file under the mount path
    holding that key's value. The kubelet keeps this data in tmpfs, so it is not written
    to the node's disk. Environment variables are a separate way of consuming Secrets.
  references:
    - https://kubernetes.io/docs/concepts/configuration/secret/

- id: kcna-co-049
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: Which kind of volume driver is required to use the VolumeSnapshot API?
  options:
    A: "A CSI driver that implements snapshots"
    B: "Any in-tree volume plugin"
    C: "The built-in hostPath driver on every node"
    D: "An emptyDir medium set to Memory"
  answer: A
  explanation: >
    A VolumeSnapshot is a user's request for a snapshot of a volume, much like a PVC is a
    request for storage, and its attributes come from a VolumeSnapshotClass. Snapshot
    support is only available for CSI drivers, and only those that implement it.
  references:
    - https://kubernetes.io/docs/concepts/storage/volume-snapshots/

- id: kcna-co-050
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    Which access mode makes sure that only one Pod in the whole cluster can read or
    write a volume?
  options:
    A: "ReadWriteOnce"
    B: "ReadOnlyMany"
    C: "ReadWriteOncePod"
    D: "ReadWriteMany"
  answer: C
  explanation: >
    ReadWriteOncePod (stable since v1.29, CSI volumes only) limits a volume to a single
    Pod. ReadWriteOnce limits it to a single node, so several Pods on that node can still
    use it. ReadOnlyMany and ReadWriteMany allow access from many nodes.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

- id: kcna-co-051
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    A cluster has no dynamic provisioning and only 50Gi PersistentVolumes. A PVC requests
    100Gi. What happens to the PVC?
  options:
    A: "It binds to two 50Gi volumes and joins them together"
    B: "It stays unbound until a matching 100Gi volume exists"
    C: "It binds to one 50Gi volume and grows it on first use"
    D: "It is rejected by the API server when it is created"
  answer: B
  explanation: >
    Claims remain unbound indefinitely if no matching volume exists, and are bound when a
    matching one becomes available. A PVC binds to exactly one PersistentVolume, and the
    API server accepts the claim even when nothing can satisfy it yet.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/

- id: kcna-co-065
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    Many early volume plugins were compiled into Kubernetes itself ("in-tree"). Which
    problem does the Container Storage Interface (CSI) solve for storage vendors?
  options:
    A: "It stores volume data in etcd so vendors no longer need disks"
    B: "It ships a separate, vendor-specific kubelet build for each storage system"
    C: "Vendors build drivers to an open spec without changing Kubernetes code"
    D: "It replaces PersistentVolumes with a separate CRD per vendor"
  answer: C
  explanation: >
    CSI is a standard interface for container orchestrators to expose arbitrary storage
    systems. Vendors write a driver to that open specification and release it on their
    own schedule, without adding code to the Kubernetes repository. The same driver model
    works across orchestrators, which reduces lock-in. PVs and PVCs stay the same.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/#out-of-tree-volume-plugins
    - https://github.com/container-storage-interface/spec

- id: kcna-co-079
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: What is the difference between static and dynamic provisioning of PersistentVolumes?
  options:
    A: "Static PVs can only be mounted read-only, while dynamic PVs are writable"
    B: "Admins create static PVs in advance; dynamic PVs are created on demand"
    C: "Static PVs live on the node's local disk, while dynamic PVs live in etcd"
    D: "Static PVs belong to one namespace, while dynamic PVs are cluster-wide"
  answer: B
  explanation: >
    With static provisioning a cluster administrator creates PersistentVolumes in advance,
    and claims bind to them. With dynamic provisioning the provisioner named in a
    StorageClass creates a volume automatically when a PVC asks for one. Both kinds of PV
    are cluster-scoped, can be writable, and are backed by real storage, not etcd.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    - https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/

- id: kcna-co-080
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    A StatefulSet runs three database replicas, and each one needs its own persistent disk
    that stays with it when it is rescheduled. Which StatefulSet feature provides this?
  options:
    A: "volumeClaimTemplates, which create one PVC for each replica"
    B: "A single shared PVC listed under the Pod template's volumes"
    C: "An emptyDir volume with its medium set to Memory"
    D: "A hostPath volume that points at the same path on every node"
  answer: A
  explanation: >
    A StatefulSet's volumeClaimTemplates create one PersistentVolumeClaim per Pod (for
    example data-db-0 and data-db-1). When a Pod is rescheduled it gets the same claim
    back, so its data follows it. A shared PVC would give every replica the same volume,
    emptyDir is deleted with the Pod, and hostPath ties the data to one node.
  references:
    - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#stable-storage

- id: kcna-co-081
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: >
    Two containers in the same Pod need to share scratch files, and the data only has to
    last as long as the Pod. Which volume type fits best?
  options:
    A: hostPath
    B: PersistentVolumeClaim
    C: configMap
    D: emptyDir
  answer: D
  explanation: >
    An emptyDir volume is created empty when the Pod starts on a node, can be mounted by
    every container in the Pod, and is deleted together with the Pod. A PVC keeps data
    beyond the Pod's life, hostPath exposes the node's own filesystem, and a configMap
    volume provides read-only configuration.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/#emptydir

- id: kcna-co-095
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: A PersistentVolume has the reclaim policy Retain. What happens when its PVC is deleted?
  options:
    A: "The volume and its data are deleted automatically"
    B: "The data is wiped and the PV becomes available again"
    C: "The PV and its data stay until an admin cleans up"
    D: "The PV is moved to another StorageClass for reuse"
  answer: C
  explanation: >
    With Retain, the PV is released but kept, together with its data, and it is not
    offered to new claims. An administrator must reclaim it manually. Delete removes the
    PV and the underlying storage, and the old Recycle policy (wipe and reuse) is
    deprecated.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#reclaiming

- id: kcna-co-096
  domain: container-orchestration
  topic: storage
  difficulty: easy
  question: >
    Pods on several different nodes must mount the same volume and write to it at the same
    time. Which access mode is needed?
  options:
    A: ReadWriteOnce
    B: ReadOnlyMany
    C: ReadWriteOncePod
    D: ReadWriteMany
  answer: D
  explanation: >
    ReadWriteMany lets the volume be mounted read-write by many nodes at once, which needs
    storage that supports it, such as NFS. ReadWriteOnce allows a single node,
    ReadWriteOncePod a single Pod, and ReadOnlyMany is read-only.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes

- id: kcna-co-097
  domain: container-orchestration
  topic: storage
  difficulty: medium
  question: >
    A database's PVC is almost full. Which setting must be enabled for you to grow it by
    raising the PVC's requested storage size?
  options:
    A: "The PVC's access mode must be changed to ReadWriteMany"
    B: "allowVolumeExpansion must be true in its StorageClass"
    C: "The PV's reclaim policy must be changed to Retain first"
    D: "The Pod using the PVC must set a larger memory limit"
  answer: B
  explanation: >
    A PVC can be expanded only when its StorageClass sets allowVolumeExpansion to true (and
    the driver supports it). You then edit the PVC to request more storage. Access modes,
    reclaim policies and Pod memory limits do not control volume expansion.
  references:
    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/#expanding-persistent-volumes-claims
    - https://kubernetes.io/docs/concepts/storage/storage-classes/

- id: kcna-co-098
  domain: container-orchestration
  topic: storage
  difficulty: hard
  question: >
    You update a ConfigMap. One Pod consumes it as a mounted volume, and another consumes
    it as environment variables. Neither Pod is restarted. What happens?
  options:
    A: "Both Pods see the new values within about a minute"
    B: "Neither Pod sees the new values until it is restarted"
    C: "The mounted files update eventually; env vars keep old values"
    D: "The env vars update at once; the mounted files keep old values"
  answer: C
  explanation: >
    The kubelet periodically syncs mounted ConfigMaps, so the files change after a short
    delay (unless they are mounted with subPath). Environment variables are set when the
    container starts and need a Pod restart to change.
  references:
    - https://kubernetes.io/docs/concepts/configuration/configmap/#mounted-configmaps-are-updated-automatically
